<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base64</title>
<meta name="description" content="本地离线 Base64 编码与解码：支持 UTF-8 中文、URL 安全格式、Data URL 与文件转换。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="toolbox.css">
<script src="toolbox-nav.js"></script>
<style>
  .file-card { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
  .file-card h3 { margin: 0; font-size: 14px; font-weight: 600; word-break: break-all; }
  .file-card .kv { max-width: 520px; }
  .file-card button { align-self: flex-start; }
  body.dragging .workspace { outline: 2px dashed var(--accent); outline-offset: -4px; }
</style>
</head>
<body>
<header class="titlebar">
  <nav class="tool-tabs" id="toolTabs" data-current="base64"></nav>
  <div class="titlebar-right" id="toolboxControls"></div>
</header>

<div class="toolbar">
  <span class="seg" role="group" data-i18n-aria="aria.mode">
    <button type="button" id="modeEncode" data-mode="encode" aria-pressed="true" data-i18n="mode.encode">编码</button>
    <button type="button" id="modeDecode" data-mode="decode" aria-pressed="false" data-i18n="mode.decode">解码</button>
  </span>
  <span class="tb-sep"></span>
  <label class="chk" data-i18n-title="tip.urlSafe"><input type="checkbox" id="optUrlSafe"><span data-i18n="opt.urlSafe">URL 安全</span></label>
  <label class="chk" data-i18n-title="tip.noPad"><input type="checkbox" id="optNoPad"><span data-i18n="opt.noPad">去掉填充</span></label>
  <label class="chk" data-i18n-title="tip.dataUrl"><input type="checkbox" id="optDataUrl"><span data-i18n="opt.dataUrl">Data URL</span></label>
  <span class="tb-sep"></span>
  <button type="button" id="btnOpen" data-i18n="btn.openFile" data-i18n-title="tip.openFile">打开文件</button>
  <button type="button" id="btnSample" data-i18n="btn.sample" data-i18n-title="tip.sample">示例</button>
  <button type="button" id="btnSwap" data-i18n="btn.swap" data-i18n-title="tip.swap">交换</button>
  <button type="button" id="btnClear" data-i18n="btn.clear" data-i18n-title="tip.clear">清空</button>
  <span class="tb-sep"></span>
  <button type="button" id="btnCopy" data-i18n="btn.copyOut">复制结果</button>
  <button type="button" id="btnDownload" data-i18n="btn.dlOut">下载结果</button>
</div>

<main class="workspace">
  <section class="pane">
    <div class="pane-head"><span data-i18n="pane.input">输入</span><span class="meta" id="inMeta"></span></div>
    <div class="pane-body" id="inBody">
      <textarea class="code" id="input" spellcheck="false" autocomplete="off" data-i18n-aria="pane.input"></textarea>
      <div class="file-card" id="fileCard" hidden>
        <h3 id="fileName"></h3>
        <table class="kv">
          <tr><th data-i18n="file.size"></th><td id="fileSize"></td></tr>
          <tr><th data-i18n="file.type"></th><td id="fileType"></td></tr>
        </table>
        <button type="button" id="btnUseText" data-i18n="btn.useText">改为输入文本</button>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="pane-head"><span data-i18n="pane.output">输出</span><span class="meta" id="outMeta"></span></div>
    <div class="pane-body">
      <textarea class="code" id="output" readonly spellcheck="false" data-i18n-aria="pane.output"></textarea>
    </div>
  </section>
</main>

<footer class="status">
  <span class="badge idle" id="badge"></span>
  <span class="status-msg" id="msg"></span>
</footer>
<input type="file" id="file">

      'mode.encode': 'Kodieren', 'mode.decode': 'Dekodieren', 'aria.mode': 'Richtung',
      'opt.urlSafe': 'URL-sicher', 'tip.urlSafe': 'Verwendet - und _ statt + und /, geeignet für URLs und Dateinamen',
      'opt.noPad': 'Ohne Padding', 'tip.noPad': 'Entfernt das abschließende =-Padding',
      'opt.dataUrl': 'Data-URL', 'tip.dataUrl': 'Mit Präfix data:…;base64, ausgeben – direkt als img-src verwendbar',
      'btn.openFile': 'Datei öffnen', 'tip.openFile': 'Lokale Datei in Base64 kodieren (oder ins Fenster ziehen)',
      'tip.sample': 'Beispiel laden', 'btn.swap': 'Tauschen', 'tip.swap': 'Ausgabe als neue Eingabe verwenden und Kodieren / Dekodieren umschalten',
      'btn.copyOut': 'Ergebnis kopieren', 'btn.dlOut': 'Ergebnis speichern', 'tip.clear': 'Eingabe leeren',
      'pane.input': 'Eingabe', 'pane.output': 'Ausgabe',
      'ph.encode': 'Text zum Kodieren eingeben oder eine Datei ins Fenster ziehen…', 'ph.decode': 'Base64-Text einfügen – auch Data-URLs mit data:…;base64, funktionieren…',
      'meta.chars': '{0} Zeichen', 'meta.file': 'Datei · {0}', 'btn.useText': 'Stattdessen Text eingeben',
      'file.size': 'Größe', 'file.type': 'Typ',
      'badge.idle': 'Wartet', 'badge.ok': 'Fertig', 'badge.err': 'Ungültig', 'badge.bin': 'Binär',
      'msg.encoded': 'Kodiert: {0} → {1} Zeichen', 'msg.decoded': 'Als Text dekodiert: {0}',
      'msg.binary': 'Das Ergebnis sind Binärdaten ({0}). Rechts steht eine Hex-Vorschau – mit „Ergebnis speichern“ als Datei sichern',
      'msg.badChar': 'Zeichen {0} ({1}) ist kein gültiges Base64', 'msg.badPad': 'Padding = darf nur am Ende stehen',
      'msg.badLen': 'Ungültige Länge: {0} Base64-Zeichen; eine Länge von 4n+1 ist unmöglich', 'msg.badDataUrl': 'Diese Data-URL ist nicht Base64-kodiert',
      'msg.truncated': 'Großes Ergebnis ({0}); nur der Anfang wird angezeigt. Kopieren und Speichern nutzen den vollständigen Inhalt',
      'hex.more': '… Vorschau der ersten {0} von {1} Bytes',
      'toast.binCopy': 'Binäre Ergebnisse lassen sich nicht als Text kopieren – bitte speichern', 'toast.binSwap': 'Binäre Ergebnisse können nicht als Texteingabe dienen',
      sample: 'Hallo Welt! Hello, Base64 👋'
    }
  };

  const $ = (id) => document.getElementById(id);
  const input = $('input'), output = $('output');
  const MAX_FILE = 30 * 1024 * 1024;
  const MAX_SHOWN = 2000000;
  const HEX_PREVIEW = 1024;
  const EXT_BY_MIME = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'application/pdf': 'pdf', 'application/zip': 'zip', 'application/json': 'json', 'text/plain': 'txt' };

  let mode = 'encode';
  let file = null;
  // 最近一次结果：text 为可复制文本；bytes/mime 用于下载
  let result = { text: '', bytes: null, mime: '', binary: false };
  let timer = null;

  const page = Toolbox.initPage({ current: 'base64', text: TEXT, onLang: run });
  const tr = page.tr;

  function setStatus(kind, message, badgeKey) {
    const badge = $('badge');
    badge.className = 'badge ' + kind;
    badge.textContent = tr(badgeKey || { idle: 'badge.idle', ok: 'badge.ok', err: 'badge.err', warn: 'badge.bin' }[kind]);
    const msg = $('msg');
    msg.className = 'status-msg' + (kind === 'err' ? ' error' : kind === 'warn' ? ' note' : '');
    msg.textContent = message || '';
  }

  // 按 3 的倍数分块，避免大文件一次性拼接超长参数，且分块之间不产生 = 补位
  function bytesToBase64(bytes) {
    let out = '';
    for (let i = 0; i < bytes.length; i += 24576) out += btoa(String.fromCharCode.apply(null, bytes.subarray(i, i + 24576)));
    return out;
  }

  // 浏览器只认标准字母表和补位的 Data URL，因此 Data URL 优先于 URL 安全 / 去掉填充
  function encodeBytes(bytes, mime) {
    const b64 = bytesToBase64(bytes);
    if ($('optDataUrl').checked) return 'data:' + mime + ';base64,' + b64;
    let out = b64;
    if ($('optUrlSafe').checked) out = out.replace(/\+/g, '-').replace(/\//g, '_');
    if ($('optNoPad').checked) out = out.replace(/=+$/, '');
    return out;
  }

  // 宽松解码：忽略空白，兼容 URL 安全字符、缺失补位和 Data URL；返回 { bytes, mime } 或 { error }
  function decodeText(raw) {
    let body = raw, mime = '';
    const head = /^\s*data:([^;,]*)((?:;[^;,]*)*),/i.exec(raw);
    if (head) {
      if (!/;base64/i.test(head[2])) return { error: tr('msg.badDataUrl') };
      mime = head[1].toLowerCase();
      body = raw.slice(head[0].length);
    }
    let clean = '', pos = head ? head[0].length : 0;
    for (const ch of body) {
      pos += ch.length;
      if (/\s/.test(ch)) continue;
      if (!/[A-Za-z0-9+/=_-]/.test(ch)) return { error: tr('msg.badChar', [...raw.slice(0, pos)].length, JSON.stringify(ch)) };
      clean += ch;
    }
    if (/=[^=]/.test(clean)) return { error: tr('msg.badPad') };
    clean = clean.replace(/=+$/, '').replace(/-/g, '+').replace(/_/g, '/');
    if (clean.length % 4 === 1) return { error: tr('msg.badLen', clean.length) };
    const bin = atob(clean + '='.repeat((4 - clean.length % 4) % 4));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { bytes, mime };
  }

  function asText(bytes) {
    try {
      const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      return /[\u0000-\u0008\u000E-\u001F\u007F]/.test(text) ? null : text;
    } catch (e) {
      return null;
    }
  }

  function hexDump(bytes) {
    const lines = [];
    const n = Math.min(bytes.length, HEX_PREVIEW);
    for (let off = 0; off < n; off += 16) {
      const row = bytes.subarray(off, Math.min(off + 16, n));
      const hex = Array.from(row, (b) => b.toString(16).padStart(2, '0'));
      const left = hex.slice(0, 8).join(' '), right = hex.slice(8).join(' ');
      const ascii = Array.from(row, (b) => (b >= 32 && b < 127 ? String.fromCharCode(b) : '.')).join('');
      lines.push(off.toString(16).padStart(8, '0') + '  ' + left.padEnd(23) + '  ' + right.padEnd(23) + '  |' + ascii + '|');
    }
    if (bytes.length > HEX_PREVIEW) lines.push('', tr('hex.more', HEX_PREVIEW, bytes.length));
    return lines.join('\n');
  }

  function guessExt(bytes, mime) {
    if (EXT_BY_MIME[mime]) return EXT_BY_MIME[mime];
    const sig = Array.from(bytes.subarray(0, 12), (b) => b.toString(16).padStart(2, '0')).join('');
    if (sig.startsWith('89504e47')) return 'png';
    if (sig.startsWith('ffd8ff')) return 'jpg';
    if (sig.startsWith('47494638')) return 'gif';
    if (sig.startsWith('25504446')) return 'pdf';
    if (sig.startsWith('504b0304')) return 'zip';
    if (sig.startsWith('52494646') && sig.slice(16, 24) === '57454250') return 'webp';
    return 'bin';
  }

  function show(text) {
    output.value = text.length > MAX_SHOWN ? text.slice(0, MAX_SHOWN) : text;
    output.scrollTop = 0;
    $('outMeta').textContent = text ? tr('meta.chars', text.length.toLocaleString()) : '';
  }

  function run() {
    input.placeholder = tr(mode === 'encode' ? 'ph.encode' : 'ph.decode');
    $('optDataUrl').disabled = mode === 'decode';
    $('optUrlSafe').disabled = $('optNoPad').disabled = mode === 'decode' || $('optDataUrl').checked;
    $('modeEncode').setAttribute('aria-pressed', String(mode === 'encode'));
    $('modeDecode').setAttribute('aria-pressed', String(mode === 'decode'));
    input.hidden = Boolean(file);
    $('fileCard').hidden = !file;
    $('inMeta').textContent = file ? tr('meta.file', Toolbox.fmtBytes(file.bytes.length))
      : input.value ? tr('meta.chars', input.value.length.toLocaleString()) : '';

    result = { text: '', bytes: null, mime: '', binary: false };
    if (!file && !input.value) { show(''); setStatus('idle'); return; }

    if (mode === 'encode') {
      const bytes = file ? file.bytes : new TextEncoder().encode(input.value);
      const mime = file ? file.mime : 'text/plain;charset=utf-8';
      result.text = encodeBytes(bytes, mime);
      result.mime = 'text/plain';
      show(result.text);
      const big = result.text.length > MAX_SHOWN;
      if (big) setStatus('warn', tr('msg.truncated', Toolbox.fmtBytes(result.text.length)), 'badge.ok');
      else setStatus('ok', tr('msg.encoded', Toolbox.fmtBytes(bytes.length), result.text.length.toLocaleString()));
      return;
    }

    const decoded = decodeText(input.value);
    if (decoded.error) { show(''); setStatus('err', decoded.error); return; }
    result.bytes = decoded.bytes;
    result.mime = decoded.mime;
    const text = asText(decoded.bytes);
    if (text === null) {
      result.binary = true;
      show(hexDump(decoded.bytes));
      setStatus('warn', tr('msg.binary', Toolbox.fmtBytes(decoded.bytes.length)));
      return;
    }
    result.text = text;
    show(text);
    setStatus('ok', tr('msg.decoded', Toolbox.fmtBytes(decoded.bytes.length)));
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    if (next === 'decode') file = null;
    run();
  }

  function loadFile(f) {
    if (!f) return;
    if (f.size > MAX_FILE) { page.toast(tr('toast.tooBig')); return; }
    f.arrayBuffer().then((buf) => {
      file = { name: f.name, bytes: new Uint8Array(buf), mime: f.type || 'application/octet-stream' };
      mode = 'encode';
      $('fileName').textContent = f.name;
      $('fileSize').textContent = Toolbox.fmtBytes(f.size);
      $('fileType').textContent = file.mime;
      run();
      page.toast(tr('toast.loaded', f.name));
    }, () => page.toast(tr('toast.readFail')));
  }

  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 120); });
  $('modeEncode').addEventListener('click', () => setMode('encode'));
  $('modeDecode').addEventListener('click', () => setMode('decode'));
  ['optUrlSafe', 'optNoPad', 'optDataUrl'].forEach((id) => $(id).addEventListener('change', run));
  $('btnOpen').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
  $('btnUseText').addEventListener('click', () => { file = null; run(); input.focus(); });
  $('btnSample').addEventListener('click', () => {
    file = null;
    const sample = tr('sample');
    input.value = mode === 'encode' ? sample : bytesToBase64(new TextEncoder().encode(sample));
    run();
  });
  $('btnSwap').addEventListener('click', () => {
    if (result.binary) { page.toast(tr('toast.binSwap')); return; }
    if (!result.text) { page.toast(tr('toast.empty')); return; }
    input.value = result.text;
    file = null;
    mode = mode === 'encode' ? 'decode' : 'encode';
    run();
  });
  $('btnClear').addEventListener('click', () => {
    input.value = '';
    file = null;
    run();
    input.focus();
    page.toast(tr('toast.cleared'));
  });
  $('btnCopy').addEventListener('click', () => {
    if (result.binary) { page.toast(tr('toast.binCopy')); return; }
    page.copy(result.text);
  });
  $('btnDownload').addEventListener('click', () => {
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    if (mode === 'decode' && result.bytes) {
      const ext = result.binary ? guessExt(result.bytes, result.mime) : 'txt';
      page.download(new Blob([result.bytes], { type: result.mime || 'application/octet-stream' }), 'base64-decoded-' + stamp + '.' + ext);
    } else {
      page.download(result.text, 'base64-' + stamp + '.txt');
    }
  });

  ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget) return;
    document.body.classList.remove('dragging');
  }));
  document.addEventListener('drop', (e) => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

  run();
})();
</script>
</body>
</html>
