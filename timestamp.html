<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间戳</title>
<meta name="description" content="本地离线 Unix 时间戳转换：当前时间戳、秒/毫秒/微秒/纳秒自动识别、日期转时间戳与多时区显示。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="toolbox.css">
<script src="toolbox-nav.js"></script>
<style>
  .ts-main { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .ts-wrap { max-width: 980px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    font-size: 13.5px; font-weight: 600;
  }
  .card-head .badge { margin-left: auto; font-weight: 600; }
  .card-body { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .row button, .row select, .row input {
    height: var(--ctl-h); padding: 0 var(--ctl-px);
    font-size: var(--ctl-fs); line-height: 1.2; border-radius: var(--ctl-r);
  }
  .row input { flex: 1 1 260px; min-width: 0; font-family: var(--mono); }
  .toolbar select#tz { flex: 0 1 280px; min-width: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 40px; }
  .stat { min-width: 0; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-val { font: 600 30px/1.25 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); word-break: break-all; }
  .stat-val.main { color: var(--accent); }
  .now-line { font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; }
  .now-line .dim { color: var(--muted); }
  .ts-msg { font-size: 12.5px; color: var(--muted); }
  .ts-msg.error { color: var(--err); }
  .ts-msg.note { color: var(--warn); }
  .card .kv tr:last-child th, .card .kv tr:last-child td { border-bottom: 0; }
  .card .kv { border-top: 1px solid var(--border); }
  .kv th { min-width: 130px; padding-left: 14px; }
  .kv td { word-break: normal; overflow-wrap: anywhere; }
  .kv td.empty { color: var(--placeholder); }
  .kv td.act { width: 1%; padding: 4px 14px 4px 6px; vertical-align: middle; font-family: inherit; }
  .kv td.act button { padding: 2px 10px; font-size: 12px; line-height: 1.4; }
  @media (max-width: 560px) {
    .ts-wrap { padding: 10px; gap: 10px; }
    .stat-val { font-size: 24px; }
    .kv th, .kv td { padding-left: 8px; padding-right: 8px; }
    .kv th { white-space: normal; min-width: 64px; }
  }
</style>
</head>
<body>
<header class="titlebar">
  <nav class="tool-tabs" id="toolTabs" data-current="timestamp"></nav>
  <div class="titlebar-right" id="toolboxControls"></div>
</header>

<div class="toolbar">
  <label class="tb-label" for="tz" data-i18n="tb.zone">时区</label>
  <select id="tz"></select>
</div>

<main class="ts-main">
  <div class="ts-wrap">
    <section class="card">
      <div class="card-head"><span data-i18n="sec.now">当前时间</span><span class="badge warn" id="pausedTag" data-i18n="now.paused" hidden>已暂停</span></div>
      <div class="card-body">
        <div class="stats">
          <div class="stat"><div class="stat-label" data-i18n="now.sec">秒</div><div class="stat-val main" id="nowSec"></div></div>
          <div class="stat"><div class="stat-label" data-i18n="now.ms">毫秒</div><div class="stat-val" id="nowMs"></div></div>
        </div>
        <div class="now-line"><span id="nowWall"></span> <span class="dim" id="nowZone"></span></div>
        <div class="row">
          <button type="button" id="btnCopySec" data-i18n="btn.copySec">复制秒</button>
          <button type="button" id="btnCopyMs" data-i18n="btn.copyMs">复制毫秒</button>
          <button type="button" id="btnPause"></button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head" data-i18n="sec.ts">时间戳 → 日期</div>
      <div class="card-body">
        <div class="row">
          <input type="text" id="tsInput" spellcheck="false" autocomplete="off" data-i18n-ph="ph.ts" data-i18n-aria="aria.ts">
          <select id="tsUnit" data-i18n-aria="aria.unit">
            <option value="auto" data-i18n="unit.auto">自动</option>
            <option value="s" data-i18n="unit.s">秒</option>
            <option value="ms" data-i18n="unit.ms">毫秒</option>
            <option value="us" data-i18n="unit.us">微秒</option>
            <option value="ns" data-i18n="unit.ns">纳秒</option>
          </select>
          <button type="button" id="btnTsNow" data-i18n="btn.useNow">使用当前时间</button>
        </div>
        <div class="ts-msg" id="tsMsg" hidden></div>
      </div>
      <table class="kv" id="tsTable"></table>
    </section>

    <section class="card">
      <div class="card-head" data-i18n="sec.date">日期 → 时间戳</div>
      <div class="card-body">
        <div class="row">
          <input type="text" id="dateInput" spellcheck="false" autocomplete="off" data-i18n-ph="ph.date" data-i18n-aria="aria.date">
          <button type="button" id="btnDateNow" data-i18n="btn.now">现在</button>
        </div>
        <div class="ts-msg" id="dateMsg"></div>
      </div>
      <table class="kv" id="dateTable"></table>
    </section>
  </div>
</main>

<footer class="status">
  <span class="badge idle" id="badge"></span>
  <span class="status-msg" id="msg"></span>
</footer>

  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const MAX_MS = 8.64e15;
  const MAX_NS = 8640000000000000000000n;
  const TZ_KEY = 'toolbox-timestamp-tz';
  const COMMON_ZONES = ['Asia/Shanghai', 'Asia/Tokyo', 'Asia/Seoul', 'Asia/Singapore', 'Asia/Kolkata', 'Europe/London', 'Europe/Paris',
    'Europe/Berlin', 'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Australia/Sydney'];
  const UNIT_NS = { s: 1000000000n, ms: 1000000n, us: 1000n, ns: 1n };
  const UNIT_FRAC = { s: 9, ms: 6, us: 3, ns: 0 };
  const UNIT_BASE_DIGITS = { s: 0, ms: 3, us: 6, ns: 9 };
  const REL_UNITS = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
  const TS_ROWS = ['unit', 'zone', 'utc', 'iso', 'rfc', 'rel', 'weekday', 'week'];
  const DATE_ROWS = ['sec', 'ms', 'isoUtc'];

  const LOCAL_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  const fmtCache = new Map();
  const cells = {};
  let zoneChoice = 'local';
  let paused = false;
  let shownNow = Date.now();
  let active = null;
  let tsState = null;
  let dateState = null;
  let lastSec = 0;

  const store = {
    get() { try { return localStorage.getItem(TZ_KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(TZ_KEY, v); } catch (e) { /* 存储不可用时仅本次生效 */ } }
  };

  const page = Toolbox.initPage({ current: 'timestamp', text: TEXT, onLang: renderAll });
  const tr = page.tr;
  const zone = () => (zoneChoice === 'local' ? LOCAL_ZONE : zoneChoice);

  // ===== 日历算法：不受 Date 范围限制，负年份按天文纪年（ISO） =====
  function daysFromCivil(y, m, d) {
    y -= m <= 2 ? 1 : 0;
    const era = Math.floor(y / 400);
    const yoe = y - era * 400;
    const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
    return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468;
  }

  function civilFromDays(z) {
    z += 719468;
    const era = Math.floor(z / 146097);
    const doe = z - era * 146097;
    const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
    const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
    const mp = Math.floor((5 * doy + 2) / 153);
    const m = mp < 10 ? mp + 3 : mp - 9;
    return { y: yoe + era * 400 + (m <= 2 ? 1 : 0), m, d: doy - Math.floor((153 * mp + 2) / 5) + 1 };
  }

  const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  const monthDays = (y, m) => (m === 2 ? (isLeap(y) ? 29 : 28) : [31, 0, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]);
  const pad = (n, w) => String(n).padStart(w || 2, '0');
  const fmtYear = (y) => (y >= 0 && y <= 9999 ? pad(y, 4) : (y < 0 ? '-' : '+') + pad(Math.abs(y), 6));

  function zoneFormatter(tz) {
    if (!fmtCache.has(tz)) {
      fmtCache.set(tz, new Intl.DateTimeFormat('en-US-u-ca-gregory-nu-latn', {
        timeZone: tz, hourCycle: 'h23', era: 'short',
        year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric'
      }));
    }
    return fmtCache.get(tz);
  }

  // 时区在 t 时刻相对 UTC 的偏移（毫秒）
  function offsetAt(t, tz) {
    if (tz === 'UTC') return 0;
    const s = Math.floor(t / 1000) * 1000;
    const p = {};
    zoneFormatter(tz).formatToParts(s).forEach((part) => { p[part.type] = part.value; });
    const y = /^B/i.test(p.era || '') ? 1 - Number(p.year) : Number(p.year);
    const wall = daysFromCivil(y, Number(p.month), Number(p.day)) * DAY +
      (Number(p.hour) % 24) * 3600000 + Number(p.minute) * 60000 + Number(p.second) * 1000;
    return wall - s;
  }

  function wallParts(t, tz) {
    const off = offsetAt(t, tz);
    const w = t + off;
    const days = Math.floor(w / DAY);
    const rest = w - days * DAY;
    const c = civilFromDays(days);
    return {
      y: c.y, m: c.m, d: c.d, days, off,
      h: Math.floor(rest / 3600000), mi: Math.floor(rest / 60000) % 60, s: Math.floor(rest / 1000) % 60, ms: rest % 1000
    };
  }

  function fmtOffset(off) {
    const a = Math.abs(Math.round(off / 1000));
    const base = (off < 0 ? '-' : '+') + pad(Math.floor(a / 3600)) + ':' + pad(Math.floor(a / 60) % 60);
    return a % 60 ? base + ':' + pad(a % 60) : base;
  }

  const fmtDate = (p) => fmtYear(p.y) + '-' + pad(p.m) + '-' + pad(p.d);
  const fmtClock = (p) => pad(p.h) + ':' + pad(p.mi) + ':' + pad(p.s);
  const fmtWall = (p, frac) => fmtDate(p) + ' ' + fmtClock(p) + (frac === '' ? '' : '.' + (frac || pad(p.ms, 3)));
  const fmtIso = (p, frac, utcZ) => fmtDate(p) + 'T' + fmtClock(p) + '.' + (frac || pad(p.ms, 3)) + (utcZ ? 'Z' : fmtOffset(p.off));

  function isoWeek(p) {
    const wd = ((p.days % 7) + 7 + 3) % 7 + 1;
    const thursday = p.days - wd + 4;
    const ty = civilFromDays(thursday).y;
    return fmtYear(ty) + '-W' + pad(Math.floor((thursday - daysFromCivil(ty, 1, 1)) / 7) + 1);
  }

  function relTime(t) {
    const diff = (t - Date.now()) / 1000;
    const abs = Math.abs(diff);
    const unit = REL_UNITS.find(([, sec]) => abs >= sec) || REL_UNITS[REL_UNITS.length - 1];
    return new Intl.RelativeTimeFormat(page.lang, { numeric: 'auto' }).format(Math.round(diff / unit[1]), unit[0]);
  }

  // ===== 状态与表格 =====
  function setStatus(st) {
    const s = st || { kind: 'idle', msg: tr('msg.idle') };
    const badge = $('badge');
    badge.className = 'badge ' + s.kind;
    badge.textContent = tr('badge.' + s.kind);
    const msg = $('msg');
    msg.className = 'status-msg' + (s.kind === 'err' ? ' error' : s.note ? ' note' : '');
    msg.textContent = s.msg;
  }

  function setInline(el, text, kind) {
    el.hidden = !text;
    el.className = 'ts-msg' + (kind ? ' ' + kind : '');
    el.textContent = text || '';
  }

  function buildTable(table, keys) {
    keys.forEach((key) => {
      const row = table.insertRow();
      const th = document.createElement('th');
      th.dataset.i18n = 'row.' + key;
      th.textContent = tr('row.' + key);
      const td = row.insertCell();
      const act = row.insertCell();
      act.className = 'act';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.i18n = 'btn.copy';
      btn.textContent = tr('btn.copy');
      btn.addEventListener('click', () => page.copy(td.dataset.value || ''));
      act.appendChild(btn);
      row.prepend(th);
      cells[key] = { td, btn };
    });
  }

  function setCell(key, value) {
    const c = cells[key];
    c.td.dataset.value = value || '';
    c.td.textContent = value || '—';
    c.td.classList.toggle('empty', !value);
    c.btn.disabled = !value;
  }

  const clearCells = (keys) => keys.forEach((k) => setCell(k, ''));

  // ===== 时区选择 =====
  function validZone(tz) {
    try { zoneFormatter(tz); return true; } catch (e) { return false; }
  }

  function buildZones() {
    const sel = $('tz');
    sel.add(new Option('', 'local'));
    sel.add(new Option('UTC', 'UTC'));
    const used = new Set(['UTC']);
    const group = (labelKey, list) => {
      const g = document.createElement('optgroup');
      g.dataset.i18nLabel = labelKey;
      list.forEach((tz) => {
        if (used.has(tz) || !validZone(tz)) return;
        used.add(tz);
        g.appendChild(new Option(tz, tz));
      });
      if (g.children.length) sel.appendChild(g);
    };
    group('tz.common', COMMON_ZONES);
    if (typeof Intl.supportedValuesOf === 'function') group('tz.all', Intl.supportedValuesOf('timeZone'));
    const saved = store.get();
    if (saved && saved !== 'local' && !used.has(saved) && validZone(saved)) {
      used.add(saved);
      sel.add(new Option(saved, saved));
    }
    zoneChoice = saved && used.has(saved) ? saved : 'local';
    sel.value = zoneChoice;
  }

  function labelZones() {
    const sel = $('tz');
    sel.options[0].text = tr('tz.local', LOCAL_ZONE);
    sel.querySelectorAll('optgroup').forEach((g) => { g.label = tr(g.dataset.i18nLabel); });
    sel.title = tr('tb.zone');
  }

  // ===== 当前时间 =====
  function renderNow() {
    const t = shownNow;
    const p = wallParts(t, zone());
    $('nowSec').textContent = String(Math.floor(t / 1000));
    $('nowMs').textContent = String(t);
    $('nowWall').textContent = fmtWall(p, '') + ' UTC' + fmtOffset(p.off);
    $('nowZone').textContent = zone();
    $('btnPause').textContent = tr(paused ? 'btn.resume' : 'btn.pause');
    $('btnPause').setAttribute('aria-pressed', String(paused));
    $('pausedTag').hidden = !paused;
  }

  function tick() {
    const now = Date.now();
    if (!paused) {
      shownNow = now;
      renderNow();
    }
    const sec = Math.floor(now / 1000);
    if (sec !== lastSec) {
      lastSec = sec;
      if (tsState) setCell('rel', relTime(tsState.ms));
    }
  }

  function copyNow(field) {
    if (!paused) { shownNow = Date.now(); renderNow(); }
    page.copy(field === 's' ? String(Math.floor(shownNow / 1000)) : String(shownNow));
  }

  // ===== 时间戳 → 日期 =====
  function parseTimestamp(raw, unitSel) {
    const s = raw.trim();
    if (/^[+-]?\d{1,3}(?:[,_\s'’]\d{3})+(?:\.\d+)?$/.test(s) || /^[+-]?\d[\d,_\s]*(?:\.\d+)?$/.test(s) && /[,_\s]/.test(s)) {
      return { error: tr('err.sep') };
    }
    const m = /^([+-])?(\d+)(?:\.(\d+))?$/.exec(s);
    if (!m) return { error: tr('err.nan') };
    const digits = m[2].replace(/^0+/, '').length || 1;
    let unit = unitSel;
    if (unit === 'auto') {
      unit = digits <= 10 ? 's' : digits <= 13 ? 'ms' : digits <= 16 ? 'us' : digits <= 19 ? 'ns' : '';
      if (!unit) return { error: tr('err.digits', digits) };
    }
    const frac = m[3] || '';
    const fracDigits = UNIT_FRAC[unit];
    let ns = BigInt(m[2]) * UNIT_NS[unit] + (fracDigits ? BigInt(frac.slice(0, fracDigits).padEnd(fracDigits, '0')) : 0n);
    if (m[1] === '-') ns = -ns;
    if (ns > MAX_NS || ns < -MAX_NS) return { error: tr('err.range') };
    let msBig = ns / 1000000n;
    if (ns % 1000000n < 0n) msBig -= 1n;
    let inSec = ns % 1000000000n;
    if (inSec < 0n) inSec += 1000000000n;
    const shown = Math.min(9, Math.max(3, UNIT_BASE_DIGITS[unit] + frac.length));
    return { ms: Number(msBig), frac: pad(inSec, 9).slice(0, shown), unit, auto: unitSel === 'auto', digits };
  }

  function runTs() {
    const raw = $('tsInput').value;
    tsState = null;
    if (!raw.trim()) { clearCells(TS_ROWS); setInline($('tsMsg'), ''); return null; }
    const r = parseTimestamp(raw, $('tsUnit').value);
    if (r.error) { clearCells(TS_ROWS); setInline($('tsMsg'), r.error, 'error'); return { kind: 'err', msg: r.error }; }
    tsState = r;
    const tz = zone();
    const p = wallParts(r.ms, tz);
    const u = wallParts(r.ms, 'UTC');
    const unitName = tr('unit.' + r.unit);
    const zoned = fmtWall(p, r.frac) + ' UTC' + fmtOffset(p.off);
    setInline($('tsMsg'), '');
    setCell('unit', r.auto ? tr('val.auto', unitName, r.digits) : tr('val.manual', unitName));
    setCell('zone', zoned);
    setCell('utc', fmtWall(u, r.frac));
    setCell('iso', fmtIso(p, r.frac, tz === 'UTC'));
    setCell('rfc', new Date(r.ms).toUTCString());
    setCell('rel', relTime(r.ms));
    setCell('weekday', new Intl.DateTimeFormat(page.lang, { weekday: 'long', timeZone: tz }).format(r.ms));
    setCell('week', isoWeek(p));
    return { kind: 'ok', msg: tr('msg.ts', unitName, zoned) };
  }

  // ===== 日期 → 时间戳 =====
  const DATE_RE = /^([+-]\d{6}|\d{4})([-/])(\d{1,2})\2(\d{1,2})(?:(?:[Tt]|\s+)(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:[.,](\d{1,9}))?)?\s*([Zz]|[+-]\d{2}(?::?\d{2})?)?)?$/;

  function parseDate(raw) {
    const m = DATE_RE.exec(raw.trim());
    if (!m) return { error: tr('err.format') };
    const y = Number(m[1]), mo = Number(m[3]), d = Number(m[4]);
    const h = Number(m[5] || 0), mi = Number(m[6] || 0), s = Number(m[7] || 0);
    if (m[1] === '-000000') return { error: tr('err.format') };
    if (mo < 1 || mo > 12) return { error: tr('err.month', m[3]) };
    if (d < 1 || d > monthDays(y, mo)) return { error: tr('err.day', m[4], y, mo, monthDays(y, mo)) };
    if (h > 23) return { error: tr('err.hour', m[5]) };
    if (mi > 59) return { error: tr('err.minute', m[6]) };
    if (s > 59) return { error: tr('err.second', m[7]) };
    const ms = Number((m[8] || '').slice(0, 3).padEnd(3, '0'));
    const wall = daysFromCivil(y, mo, d) * DAY + h * 3600000 + mi * 60000 + s * 1000 + ms;
    let offset = null;
    if (m[9]) {
      const om = /^([+-])(\d{2}):?(\d{2})?$/.exec(m[9]);
      if (om) {
        const oh = Number(om[2]), omin = Number(om[3] || 0);
        if (oh > 23 || omin > 59) return { error: tr('err.offset', m[9]) };
        offset = (om[1] === '-' ? -1 : 1) * (oh * 3600000 + omin * 60000);
      } else {
        offset = 0;
      }
    }
    return { wall, offset, offsetText: m[9] ? (offset === 0 && /z/i.test(m[9]) ? 'Z' : fmtOffset(offset)) : '' };
  }

  const clampMs = (x) => Math.min(MAX_MS, Math.max(-MAX_MS, x));

  // 本地墙上时间 → 时刻：用前后一天的偏移得到两个候选；都不成立说明落在夏令时缺口，取较晚的有效时刻
  function wallToEpoch(wall, tz) {
    const before = offsetAt(clampMs(wall - DAY), tz);
    const after = offsetAt(clampMs(wall + DAY), tz);
    const tA = wall - before, tB = wall - after;
    const okA = offsetAt(clampMs(tA), tz) === before;
    const okB = offsetAt(clampMs(tB), tz) === after;
    if (okA && okB) return tA === tB ? { t: tA, kind: 'ok' } : { t: Math.min(tA, tB), kind: 'overlap' };
    if (okA || okB) return { t: okA ? tA : tB, kind: 'ok' };
    return { t: Math.max(tA, tB), kind: 'gap' };
  }

  function fmtSeconds(ms) {
    const sign = ms < 0 ? '-' : '';
    const a = Math.abs(ms);
    const sec = Math.floor(a / 1000), rest = a % 1000;
    return sign + sec + (rest ? '.' + pad(rest, 3) : '');
  }

  function runDate() {
    const raw = $('dateInput').value;
    const tz = zone();
    dateState = null;
    if (!raw.trim()) { clearCells(DATE_ROWS); setInline($('dateMsg'), tr('hint.formats')); return null; }
    const r = parseDate(raw);
    if (r.error) { clearCells(DATE_ROWS); setInline($('dateMsg'), r.error, 'error'); return { kind: 'err', msg: r.error }; }
    let t, hint, note = false;
    if (r.offset !== null) {
      t = r.wall - r.offset;
      hint = tr('hint.offset', r.offsetText);
    } else {
      const res = wallToEpoch(r.wall, tz);
      t = res.t;
      if (Math.abs(t) <= MAX_MS && res.kind !== 'ok') {
        const p = wallParts(t, tz);
        const shownIn = raw.trim().replace(/\s+/g, ' ');
        hint = tr(res.kind === 'gap' ? 'note.gap' : 'note.overlap', shownIn, tz, fmtWall(p, '') + ' UTC' + fmtOffset(p.off));
        note = true;
      } else {
        hint = tr('hint.zone', tz, 'UTC' + fmtOffset(offsetAt(clampMs(t), tz)));
      }
    }
    if (!(Math.abs(t) <= MAX_MS)) {
      clearCells(DATE_ROWS);
      setInline($('dateMsg'), tr('err.range'), 'error');
      return { kind: 'err', msg: tr('err.range') };
    }
    dateState = t;
    setInline($('dateMsg'), hint, note ? 'note' : '');
    setCell('sec', fmtSeconds(t));
    setCell('ms', String(t));
    setCell('isoUtc', fmtIso(wallParts(t, 'UTC'), '', true));
    return { kind: 'ok', msg: note ? hint : tr('msg.date', fmtSeconds(t), String(t)), note };
  }

  // ===== 汇总渲染 =====
  function renderAll() {
    labelZones();
    renderNow();
    const a = runTs();
    const b = runDate();
    setStatus(active === 'ts' ? a : active === 'date' ? b : null);
  }

  function activate(which) {
    active = which;
    renderAll();
  }

  function fillTsNow() {
    const unit = $('tsUnit').value;
    const ms = BigInt(Date.now());
    const v = { auto: ms / 1000n, s: ms / 1000n, ms, us: ms * 1000n, ns: ms * 1000000n }[unit];
    $('tsInput').value = String(v);
    activate('ts');
  }

  function fillDateNow() {
    const p = wallParts(Date.now(), zone());
    $('dateInput').value = fmtWall(p, '');
    activate('date');
  }

  buildZones();
  buildTable($('tsTable'), TS_ROWS);
  buildTable($('dateTable'), DATE_ROWS);

  $('tz').addEventListener('change', () => {
    zoneChoice = $('tz').value;
    store.set(zoneChoice);
    renderAll();
  });
  $('tsInput').addEventListener('input', () => activate('ts'));
  $('tsUnit').addEventListener('change', () => activate('ts'));
  $('dateInput').addEventListener('input', () => activate('date'));
  $('btnTsNow').addEventListener('click', fillTsNow);
  $('btnDateNow').addEventListener('click', fillDateNow);
  $('btnCopySec').addEventListener('click', () => copyNow('s'));
  $('btnCopyMs').addEventListener('click', () => copyNow('ms'));
  $('btnPause').addEventListener('click', () => {
    paused = !paused;
    shownNow = Date.now();
    renderNow();
  });

  renderAll();
  setInterval(tick, 100);
})();
</script>
</body>
</html>
