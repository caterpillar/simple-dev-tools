<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL 编码</title>
<meta name="description" content="本地离线 URL 编码与解码：组件 / 完整 URL、空格转 +、逐行处理，并可拆解链接的协议、主机、路径和查询参数。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="toolbox.css">
<script src="toolbox-nav.js"></script>
<style>
  .scope { display: inline-flex; align-items: center; gap: 5px; }
  .scope:has(select:disabled) { opacity: .45; }
  .toolbar select:disabled, .toolbar select:disabled:hover { cursor: default; background: var(--panel-2); border-color: var(--border); }
  .info { padding-bottom: 16px; }
  .info h3 {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 0; padding: 14px 12px 6px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .info .note {
    margin: 10px 12px 0; padding: 6px 10px; border-radius: 6px; font-size: 12.5px;
    color: var(--warn);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  }
  .info .muted, .info .empty-msg { color: var(--muted); font-family: inherit; }
  .info .empty-msg { margin: 4px 12px; font-size: 12.5px; }
  .info .kv { border-top: 1px solid var(--border); }
  .mini {
    flex: 0 0 auto;
    font-size: calc(var(--chk-fs) - 1px); font-weight: 400; line-height: 1.3;
    padding: 2px calc(var(--ctl-px) - 2px); border-radius: 5px;
  }
  .ptable { width: 100%; border-collapse: collapse; font-size: 12.5px; border-top: 1px solid var(--border); }
  .ptable th, .ptable td { padding: 6px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  .ptable th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--panel); white-space: nowrap; }
  .ptable td { font-family: var(--mono); word-break: break-all; overflow-wrap: anywhere; }
  .ptable .n { width: 1%; color: var(--muted); white-space: nowrap; }
  .ptable .k { width: 32%; color: var(--key); }
  .ptable .act { width: 1%; padding: 4px 8px; font-family: inherit; text-align: right; white-space: nowrap; }
  .ptable tr:hover td { background: var(--panel); }
</style>
</head>
<body>
<header class="titlebar">
  <nav class="tool-tabs" id="toolTabs" data-current="url"></nav>
  <div class="titlebar-right" id="toolboxControls"></div>
</header>

<div class="toolbar">
  <span class="seg" role="group" data-i18n-aria="aria.mode">
    <button type="button" id="modeEncode" data-mode="encode" aria-pressed="true" data-i18n="mode.encode">编码</button>
    <button type="button" id="modeDecode" data-mode="decode" aria-pressed="false" data-i18n="mode.decode">解码</button>
    <button type="button" id="modeParse" data-mode="parse" aria-pressed="false" data-i18n="mode.parse">解析</button>
  </span>
  <span class="tb-sep"></span>
  <label class="tb-label scope" data-i18n-title="tip.scope">
    <span data-i18n="opt.scope">范围</span>
    <select id="optScope">
      <option value="comp" data-i18n="opt.comp">组件</option>
      <option value="full" data-i18n="opt.full">完整 URL</option>
    </select>
  </label>
  <label class="chk" data-i18n-title="tip.plus"><input type="checkbox" id="optPlus"><span data-i18n="opt.plus">空格用 +</span></label>
  <label class="chk" data-i18n-title="tip.lines"><input type="checkbox" id="optLines"><span data-i18n="opt.lines">逐行处理</span></label>
  <span class="tb-sep"></span>
  <button type="button" id="btnSample" data-i18n="btn.sample" data-i18n-title="tip.sample">示例</button>
  <button type="button" id="btnSwap" data-i18n="btn.swap" data-i18n-title="tip.swap">交换</button>
  <button type="button" id="btnClear" data-i18n="btn.clear" data-i18n-title="tip.clear">清空</button>
  <span class="tb-sep"></span>
  <button type="button" id="btnCopy" data-i18n="btn.copyOut" data-i18n-title="tip.copyOut">复制结果</button>
</div>

<main class="workspace">
  <section class="pane">
    <div class="pane-head"><span data-i18n="pane.input">输入</span><span class="meta" id="inMeta"></span></div>
    <div class="pane-body">
      <textarea class="code" id="input" spellcheck="false" autocomplete="off" data-i18n-aria="pane.input"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="pane-head"><span id="outLabel">输出</span><span class="meta" id="outMeta"></span></div>
    <div class="pane-body">
      <textarea class="code" id="output" readonly spellcheck="false" data-i18n-aria="pane.output"></textarea>
      <div class="info" id="parseView" hidden></div>
    </div>
  </section>
</main>

<footer class="status">
  <span class="badge idle" id="badge"></span>
  <span class="status-msg" id="msg"></span>
</footer>

  const SAMPLE_TEXT = 'q=你好 世界&tag=C#/C++?page=1';
  const SAMPLE_URL = 'https://user:p%40ss@www.example.com:8443/文档/报告 2024.pdf?q=%E4%BD%A0%E5%A5%BD+world&tag=a&tag=b&empty=&redirect=https%3A%2F%2Fexample.org%2F%3Fx%3D1#第二节';
  const DEFAULT_PORTS = { 'http:': '80', 'https:': '443', 'ws:': '80', 'wss:': '443', 'ftp:': '21' };
  const LONE_SURROGATE = /[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/;

  const $ = (id) => document.getElementById(id);
  const input = $('input'), output = $('output'), view = $('parseView');

  let mode = 'encode';
  // text：“复制结果”的内容；params：解析出的查询参数
  let result = { text: '', params: [] };
  let timer = null;

  const page = Toolbox.initPage({ current: 'url', text: TEXT, onLang: render });
  const tr = page.tr;

  const cpLen = (s) => s.length - (s.match(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g) || []).length;
  const fmtN = (n) => n.toLocaleString();

  function setStatus(kind, message, badgeKey) {
    const badge = $('badge');
    badge.className = 'badge ' + kind;
    badge.textContent = tr(badgeKey || 'badge.' + kind);
    const msg = $('msg');
    msg.className = 'status-msg' + (kind === 'err' ? ' error' : kind === 'warn' ? ' note' : '');
    msg.textContent = message || '';
  }

  // 位置按字符（码点）从 1 计；多行输入时给出行列
  function posLabel(text, index) {
    const before = text.slice(0, index);
    const line = before.split('\n').length;
    if (!text.includes('\n')) return tr('pos.char', cpLen(before) + 1);
    return tr('pos.lineCol', line, cpLen(before.slice(before.lastIndexOf('\n') + 1)) + 1);
  }

  const hexUpper = (c) => '%' + c.charCodeAt(0).toString(16).toUpperCase();

  function encodeOne(s, full, plus) {
    if (full) return plus ? encodeURI(s).replace(/%20/g, '+') : encodeURI(s);
    const out = encodeURIComponent(s);
    // 表单格式与 URLSearchParams 一致：还要转义 !'()~
    return plus ? out.replace(/%20/g, '+').replace(/[!'()~]/g, hexUpper) : out;
  }

  function byteAt(s, i) {
    const pair = s.substr(i + 1, 2);
    return s[i] === '%' && /^[0-9A-Fa-f]{2}$/.test(pair) ? parseInt(pair, 16) : -1;
  }

  function utf8Need(b) {
    if (b < 0x80) return 0;
    if (b >= 0xC2 && b <= 0xDF) return 1;
    if (b >= 0xE0 && b <= 0xEF) return 2;
    if (b >= 0xF0 && b <= 0xF4) return 3;
    return -1;
  }

  // 第二字节的合法范围用于排除超长编码、代理区和超出 U+10FFFF 的码点
  function secondRange(b) {
    if (b === 0xE0) return [0xA0, 0xBF];
    if (b === 0xED) return [0x80, 0x9F];
    if (b === 0xF0) return [0x90, 0xBF];
    if (b === 0xF4) return [0x80, 0x8F];
    return [0x80, 0xBF];
  }

  // 与 decodeURIComponent 的判定一致，但能指出第一个出错的转义
  function findBadEscape(s) {
    for (let i = s.indexOf('%'); i !== -1; i = s.indexOf('%', i)) {
      const b = byteAt(s, i);
      if (b < 0) return { index: i, snippet: s.slice(i, i + 3).split(/\s/)[0], key: 'err.badEsc' };
      const need = utf8Need(b);
      let end = i + 3, ok = need >= 0;
      for (let k = 1; ok && k <= need; k++) {
        const c = byteAt(s, end);
        const [lo, hi] = k === 1 ? secondRange(b) : [0x80, 0xBF];
        if (c < 0) { ok = false; break; }
        end += 3;
        ok = c >= lo && c <= hi;
      }
      if (!ok) return { index: i, snippet: s.slice(i, end), key: 'err.badUtf8' };
      i = end;
    }
    return null;
  }

  function convert(text) {
    const lines = $('optLines').checked;
    const plus = $('optPlus').checked;
    if (mode === 'encode') {
      const bad = LONE_SURROGATE.exec(text);
      if (bad) return { error: tr('err.surrogate', posLabel(text, bad.index), 'U+' + bad[0].charCodeAt(0).toString(16).toUpperCase()) };
      const full = $('optScope').value === 'full';
      const one = (s) => encodeOne(s, full, plus);
      return { text: lines ? text.split('\n').map(one).join('\n') : one(text) };
    }
    const src = plus ? text.replace(/\+/g, ' ') : text;
    const bad = findBadEscape(src);
    if (bad) return { error: tr(bad.key, posLabel(text, bad.index), bad.snippet) };
    return { text: lines ? src.split('\n').map(decodeURIComponent).join('\n') : decodeURIComponent(src) };
  }

  function runConvert() {
    const text = input.value;
    output.value = '';
    $('outMeta').textContent = '';
    if (!text) { setStatus('idle'); return; }
    let res;
    try {
      res = convert(text);
    } catch (e) {
      res = { error: String(e && e.message || e) };
    }
    if (res.error) { setStatus('err', res.error); return; }
    result.text = res.text;
    output.value = res.text;
    const outLen = cpLen(res.text);
    $('outMeta').textContent = tr('meta.chars', fmtN(outLen));
    let message = tr(mode === 'encode' ? 'msg.encoded' : 'msg.decoded', fmtN(cpLen(text)), fmtN(outLen));
    if ($('optLines').checked) message += tr('msg.byLine', fmtN(text.split('\n').length));
    setStatus('ok', message);
  }

  function tryUrl(s) {
    try { return new URL(s); } catch (e) { return null; }
  }

  // “localhost:8080/x”“example.com:80” 也能被当成自定义协议解析，按主机:端口处理更符合直觉
  const looksHostPort = (s) => /^[^\s/:?#@]+:\d+(?:[/?#]|$)/.test(s);
  const hasScheme = (s) => /^[a-z][a-z0-9+.-]*:/i.test(s) && !looksHostPort(s);

  function parseInput(raw) {
    const lines = raw.split('\n').map((l) => l.trim()).filter(Boolean);
    const notes = lines.length > 1 ? [tr('note.firstLine')] : [];
    const text = lines[0];
    let url = looksHostPort(text) ? null : tryUrl(text);
    if (!url && !hasScheme(text)) {
      url = tryUrl((text.startsWith('//') ? 'https:' : 'https://') + text);
      if (url) notes.push(tr('note.assumed'));
    }
    return { url, notes };
  }

  function safeDecode(s) {
    try { return { text: decodeURIComponent(s), ok: true }; } catch (e) { return { text: s, ok: false }; }
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  const muted = (text) => el('span', 'muted', text);
  const valueNode = (s, emptyKey) => (s ? document.createTextNode(s) : muted(tr(emptyKey || 'v.none')));

  function decodedNode(s) {
    if (!s) return muted(tr('v.none'));
    const dec = safeDecode(s);
    if (dec.ok) return document.createTextNode(dec.text);
    const frag = document.createDocumentFragment();
    frag.append(s, ' ', muted(tr('v.badDec')));
    return frag;
  }

  function componentRows(url) {
    const def = DEFAULT_PORTS[url.protocol];
    const port = url.port ? document.createTextNode(url.port) : muted(def ? tr('v.defPort', def) : tr('v.none'));
    return [
      ['f.href', url.href, valueNode(url.href)],
      ['f.protocol', url.protocol, valueNode(url.protocol)],
      ['f.username', url.username, valueNode(url.username)],
      ['f.password', url.password, valueNode(url.password)],
      ['f.hostname', url.hostname, valueNode(url.hostname)],
      ['f.port', url.port || def || '', port],
      ['f.origin', url.origin, valueNode(url.origin)],
      ['f.pathname', url.pathname, valueNode(url.pathname)],
      ['f.pathDec', safeDecode(url.pathname).text, decodedNode(url.pathname)],
      ['f.search', url.search, valueNode(url.search)],
      ['f.hash', url.hash, valueNode(url.hash)],
      ['f.hashDec', safeDecode(url.hash).text, decodedNode(url.hash)]
    ];
  }

  function paramsTable(params) {
    const table = el('table', 'ptable');
    const head = table.createTHead().insertRow();
    ['#', tr('col.key'), tr('col.value'), ''].forEach((t) => head.appendChild(el('th', '', t)));
    const body = table.createTBody();
    params.forEach(([key, value], i) => {
      const row = body.insertRow();
      row.appendChild(el('td', 'n', String(i + 1)));
      row.appendChild(el('td', 'k')).appendChild(valueNode(key, 'v.empty'));
      row.appendChild(el('td', 'v')).appendChild(valueNode(value, 'v.empty'));
      const btn = el('button', 'mini', tr('btn.copy'));
      btn.type = 'button';
      btn.title = tr('tip.copyRow');
      btn.disabled = !value;
      btn.addEventListener('click', () => page.copy(value));
      row.appendChild(el('td', 'act')).appendChild(btn);
    });
    return table;
  }

  // 手工拼接以保留参数首次出现的顺序（普通对象会把数字键排到前面）
  function paramsJson(params) {
    const groups = new Map();
    params.forEach(([k, v]) => groups.set(k, groups.has(k) ? [].concat(groups.get(k), v) : v));
    if (!groups.size) return '{}';
    const body = [...groups].map(([k, v]) => '  ' + JSON.stringify(k) + ': ' + JSON.stringify(v, null, 2).replace(/\n/g, '\n  '));
    return '{\n' + body.join(',\n') + '\n}';
  }

  function sectionHead(text, button) {
    const h = el('h3');
    h.appendChild(el('span', '', text));
    if (button) h.appendChild(button);
    return h;
  }

  function runParse() {
    view.replaceChildren();
    $('outMeta').textContent = '';
    if (!input.value.trim()) { setStatus('idle'); return; }
    const { url, notes } = parseInput(input.value);
    notes.forEach((n) => view.appendChild(el('p', 'note', n)));
    if (!url) { setStatus('err', tr('err.url')); return; }

    const rows = componentRows(url);
    const params = [...url.searchParams];
    view.appendChild(sectionHead(tr('sec.parts')));
    const kv = el('table', 'kv');
    rows.forEach(([key, , node]) => {
      const row = kv.insertRow();
      row.appendChild(el('th', '', tr(key)));
      row.appendChild(el('td')).appendChild(node);
    });
    view.appendChild(kv);

    const jsonBtn = el('button', 'mini', tr('btn.copyJson'));
    jsonBtn.type = 'button';
    jsonBtn.title = tr('tip.copyJson');
    jsonBtn.disabled = !params.length;
    jsonBtn.addEventListener('click', () => page.copy(paramsJson(params)));
    view.appendChild(sectionHead(tr('sec.params', params.length), jsonBtn));
    view.appendChild(params.length ? paramsTable(params) : el('p', 'empty-msg', tr('params.none')));

    const tsv = rows.map(([key, raw]) => tr(key) + '\t' + raw);
    if (params.length) tsv.push('', '#\t' + tr('col.key') + '\t' + tr('col.value'), ...params.map(([k, v], i) => (i + 1) + '\t' + k + '\t' + v));
    result = { text: tsv.join('\n'), params };
    $('outMeta').textContent = tr('meta.params', fmtN(params.length));
    const message = [tr('msg.parsed', fmtN(params.length))].concat(notes).join(' · ');
    setStatus(notes.length ? 'warn' : 'ok', message, 'badge.ok');
  }

  function render() {
    const parse = mode === 'parse';
    ['Encode', 'Decode', 'Parse'].forEach((m) => $('mode' + m).setAttribute('aria-pressed', String(mode === m.toLowerCase())));
    input.placeholder = tr('ph.' + mode);
    $('optScope').disabled = mode !== 'encode';
    $('optPlus').disabled = $('optLines').disabled = $('btnSwap').disabled = parse;
    output.hidden = parse;
    view.hidden = !parse;
    $('outLabel').textContent = tr(parse ? 'pane.parsed' : 'pane.output');
    $('inMeta').textContent = input.value ? tr('meta.chars', fmtN(cpLen(input.value))) : '';
    result = { text: '', params: [] };
    if (parse) runParse();
    else runConvert();
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    render();
  }

  function sampleFor(m) {
    if (m === 'parse') return SAMPLE_URL;
    if (m === 'decode') return encodeOne(SAMPLE_TEXT, false, $('optPlus').checked);
    return SAMPLE_TEXT;
  }

  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 120); });
  document.querySelectorAll('.seg button[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  ['optScope', 'optPlus', 'optLines'].forEach((id) => $(id).addEventListener('change', render));
  $('btnSample').addEventListener('click', () => { input.value = sampleFor(mode); render(); });
  $('btnSwap').addEventListener('click', () => {
    if (!result.text) { page.toast(tr('toast.empty')); return; }
    input.value = result.text;
    mode = mode === 'encode' ? 'decode' : 'encode';
    render();
  });
  $('btnClear').addEventListener('click', () => {
    input.value = '';
    render();
    input.focus();
    page.toast(tr('toast.cleared'));
  });
  $('btnCopy').addEventListener('click', () => page.copy(result.text));

  render();
})();
</script>
</body>
</html>
