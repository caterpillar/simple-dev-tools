<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JWT 解析</title>
<meta name="description" content="本地离线 JWT 解析：查看头部与载荷、过期状态与时间字段，并用 WebCrypto 验证 HS / RS / PS / ES 签名。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="toolbox.css">
<script src="toolbox-nav.js"></script>
<style>
  #tokenBody { overflow: hidden; }
  .pane-head.sub { border-top: 1px solid var(--border); }
  .verify { flex: 0 0 auto; display: flex; flex-direction: column; background: var(--bg); }
  .verify textarea.code { height: 140px; border-bottom: 1px solid var(--border); }
  .verify-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; }
  .verify-row label.chk { font-size: var(--chk-fs); }
  .verify-row button { height: var(--ctl-h); font-size: var(--ctl-fs); padding: 0 var(--ctl-px); border-radius: var(--ctl-r); line-height: 1.2; margin-left: auto; }
  .v-result { flex: 1 1 100%; display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--muted); }
  .v-result .badge { flex: 0 0 auto; }
  .v-msg { min-width: 0; overflow-wrap: anywhere; }
  .result { padding-bottom: 14px; }
  .empty-hint { margin: 0; padding: 14px 12px; color: var(--placeholder); font-size: 13px; }
  .note { margin: 12px 12px 2px; padding: 7px 10px; border-radius: 6px; font-size: 12.5px; overflow-wrap: anywhere;
    color: var(--text); background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent); }
  .note.err { background: color-mix(in srgb, var(--err) 10%, transparent); border-color: color-mix(in srgb, var(--err) 34%, transparent); }
  .sec h3 { display: flex; align-items: baseline; gap: 10px; margin: 0; padding: 12px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .sec h3 .meta { font-weight: 400; font-family: var(--mono); font-size: 11.5px; }
  .sec .code-out { height: auto; padding: 4px 12px 6px; overflow: visible; }
  .sec .kv th { font-family: var(--mono); color: var(--key); }
  .sec .kv td.desc { width: 1%; white-space: nowrap; font-family: inherit; font-size: 12.5px; color: var(--muted); }
  .kv .rel { margin-left: 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--muted); }
  .kv .badge { margin-left: 10px; vertical-align: 1px; }
  .kv .bad { color: var(--err); }
  @media (max-width: 900px) {
    .verify textarea.code { height: 72px; }
  }
</style>
</head>
<body>
<header class="titlebar">
  <nav class="tool-tabs" id="toolTabs" data-current="jwt"></nav>
  <div class="titlebar-right" id="toolboxControls"></div>
</header>

<div class="toolbar">
  <button type="button" id="btnSample" data-i18n="btn.sample" data-i18n-title="tip.sample">示例</button>
  <button type="button" id="btnClear" data-i18n="btn.clear" data-i18n-title="tip.clear">清空</button>
  <span class="tb-sep"></span>
  <button type="button" id="btnCopyHeader" data-i18n="btn.copyHeader" data-i18n-title="tip.copyHeader">复制头部</button>
  <button type="button" id="btnCopyPayload" data-i18n="btn.copyPayload" data-i18n-title="tip.copyPayload">复制载荷</button>
</div>

<main class="workspace">
  <section class="pane">
    <div class="pane-head"><span data-i18n="pane.token">令牌</span><span class="meta" id="tokenMeta"></span></div>
    <div class="pane-body" id="tokenBody">
      <textarea class="code" id="token" spellcheck="false" autocomplete="off" data-i18n-ph="ph.token" data-i18n-aria="pane.token"></textarea>
    </div>
    <div class="pane-head sub"><span data-i18n="pane.verify">验证签名</span><span class="meta" id="algMeta"></span></div>
    <div class="verify">
      <textarea class="code" id="key" spellcheck="false" autocomplete="off" data-i18n-aria="aria.key"></textarea>
      <div class="verify-row">
        <label class="chk" id="b64Wrap" data-i18n-title="tip.b64"><input type="checkbox" id="optB64"><span data-i18n="opt.b64">密钥是 Base64 编码</span></label>
        <button type="button" class="primary" id="btnVerify" data-i18n="btn.verify" data-i18n-title="tip.verify">验证</button>
        <div class="v-result" id="vResult" hidden><span class="badge" id="vBadge"></span><span class="v-msg" id="vMsg"></span></div>
      </div>
    </div>
  </section>
  <section class="pane">
    <div class="pane-head"><span data-i18n="pane.result">解析结果</span><span class="meta" id="outMeta"></span></div>
    <div class="pane-body result" id="out"></div>
  </section>
</main>

<footer class="status">
  <span class="badge idle" id="badge"></span>
  <span class="status-msg" id="msg"></span>
</footer>

      'seg.header': 'Header', 'seg.payload': 'Payload', 'seg.signature': 'Signatur',
      'err.segments': 'Ein JWT besteht aus 3 durch Punkte getrennten Teilen (ein JWE aus 5); gefunden: {0}', 'err.empty': '{0}: leer',
      'err.badChar': '{0}: Zeichen {2} ({1}) ist kein gültiges Base64URL (nur A–Z a–z 0–9 - _)',
      'err.badLen': '{0}: ungültige Länge für Base64URL', 'err.utf8': '{0}: die dekodierten Bytes sind kein gültiger UTF-8-Text',
      'err.json': '{0}: kein gültiges JSON ({1})', 'err.notObject': '{0}: muss ein JSON-Objekt sein',
      'v.ok': 'Signatur gültig', 'v.bad': 'Signatur ungültig', 'v.na': 'Nicht prüfbar',
      'v.okMsg': 'Die Signatur passt zum Schlüssel ({0})', 'v.badMsg': 'Die Signatur passt nicht zum Schlüssel, oder das Token wurde verändert',
      'vr.noToken': 'Bitte zuerst ein korrekt aufgebautes Token eingeben', 'vr.noKey': 'Bitte einen Schlüssel eingeben', 'vr.none': 'Das Token ist unsigniert (alg: none); es gibt keine Signatur zu prüfen',
      'vr.jwe': 'JWE-Tokens sind verschlüsselt und haben keine prüfbare Signatur', 'vr.noAlg': 'Im Header fehlt alg', 'vr.unsupported': 'Nicht unterstützter Algorithmus: {0}',
      'vr.noSubtle': 'WebCrypto (crypto.subtle) ist in diesem Browser nicht verfügbar', 'vr.badKey': 'Schlüssel konnte nicht importiert werden: ungültiges Format oder passt nicht zu {0}',
      'vr.badB64': 'Das Secret ist kein gültiges Base64', 'vr.private': 'Das ist ein privater Schlüssel – bitte den passenden öffentlichen Schlüssel (-----BEGIN PUBLIC KEY-----) einfügen',
      'vr.pemType': '{0} wird nicht unterstützt – bitte einen öffentlichen Schlüssel -----BEGIN PUBLIC KEY----- (SPKI) verwenden', 'vr.keyFormat': 'Bitte einen öffentlichen PEM-Schlüssel oder ein JWK-JSON-Objekt einfügen',
      'vr.badJson': 'Der Schlüssel sieht wie JWK aus, ist aber kein gültiges JSON', 'vr.noJwk': 'Kein Schlüssel im JWK-Set passt zur kid'
    }
  };

  const SAMPLE_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyLCJleHAiOjQxMDI0NDQ4MDB9.2rJa0xN9x5QZQTvUhAcOtrF5qH6iGAmgFeTThC4mq8o';
  const SAMPLE_SECRET = 'your-256-bit-secret';
  const TIME_CLAIMS = ['exp', 'nbf', 'iat', 'auth_time'];
  const REG_CLAIMS = ['iss', 'sub', 'aud', 'exp', 'nbf', 'iat', 'jti'];
  const SHA = { 256: 'SHA-256', 384: 'SHA-384', 512: 'SHA-512' };
  const CURVE = { 256: 'P-256', 384: 'P-384', 512: 'P-521' };
  const PUBLIC_JWK = { RSA: ['kty', 'n', 'e'], EC: ['kty', 'crv', 'x', 'y'], OKP: ['kty', 'crv', 'x'] };
  const TOKEN_RE = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|(true|false|null)|([{}[\],])/g;

  const $ = (id) => document.getElementById(id);
  const tokenEl = $('token'), keyEl = $('key');

  let state = { token: '', bearer: false, parsed: null };
  let vResult = null;
  let verifySeq = 0;
  let timer = null;

  const page = Toolbox.initPage({ current: 'jwt', text: TEXT, onLang: render });
  const tr = page.tr;

  // 错误以 [key, ...args] 保存，切换语言时重新翻译；{ seg } 参数是段名
  const fail = (...reason) => Object.assign(new Error(reason[0]), { reason });
  const say = (reason) => tr(reason[0], ...reason.slice(1).map((a) => (a && a.seg ? tr(a.seg) : a)));
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ===== 解析 =====
  function normalize(raw) {
    let s = raw.trim();
    const bearer = /^bearer\s+/i.test(s);
    if (bearer) s = s.replace(/^bearer\s+/i, '');
    return { token: s.replace(/\s+/g, ''), bearer };
  }

  function b64urlBytes(seg, name, allowEmpty) {
    const clean = seg.replace(/=+$/, '');
    if (!clean && !allowEmpty) throw fail('err.empty', { seg: name });
    const bad = /[^A-Za-z0-9_-]/.exec(clean);
    if (bad) throw fail('err.badChar', { seg: name }, JSON.stringify(bad[0]), bad.index + 1);
    if (clean.length % 4 === 1) throw fail('err.badLen', { seg: name });
    const bin = atob(clean.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - clean.length % 4) % 4));
    return Uint8Array.from(bin, (c) => c.charCodeAt(0));
  }

  function utf8(bytes, name) {
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      throw fail('err.utf8', { seg: name });
    }
  }

  // 超出安全整数的数字保留原文，避免 ID 被四舍五入
  const parseJson = (text) => JSON.parse(text, (k, v, ctx) =>
    (JSON.rawJSON && Number.isInteger(v) && !Number.isSafeInteger(v) && ctx ? JSON.rawJSON(ctx.source) : v));

  function snippet(text) {
    const s = text.replace(/\s+/g, ' ').trim();
    return s.length > 40 ? s.slice(0, 40) + '…' : s;
  }

  function decodeHeader(seg) {
    const text = utf8(b64urlBytes(seg, 'seg.header'), 'seg.header');
    let value;
    try { value = parseJson(text); } catch (e) { throw fail('err.json', { seg: 'seg.header' }, snippet(text)); }
    if (!isObj(value)) throw fail('err.notObject', { seg: 'seg.header' });
    return value;
  }

  function parseToken(token) {
    const parts = token.split('.');
    const out = { parts };
    if (parts.length !== 3 && parts.length !== 5) { out.error = ['err.segments', parts.length]; return out; }
    try {
      out.header = decodeHeader(parts[0]);
      if (parts.length === 5) { out.jwe = true; return out; }
      const text = utf8(b64urlBytes(parts[1], 'seg.payload'), 'seg.payload');
      try { out.payload = parseJson(text); } catch (e) { out.payloadText = text; }
      out.sig = b64urlBytes(parts[2], 'seg.signature', true);
    } catch (e) {
      if (!e.reason) throw e;
      out.error = e.reason;
    }
    return out;
  }

  // ===== 时间 =====
  const pad = (n) => String(n).padStart(2, '0');
  const fmtDate = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

  function relTime(diff) {
    const units = [[60, 'second', 1], [3600, 'minute', 60], [86400, 'hour', 3600], [86400 * 30, 'day', 86400],
      [86400 * 365, 'month', 86400 * 30], [Infinity, 'year', 86400 * 365]];
    const [, unit, size] = units.find((u) => Math.abs(diff) < u[0]);
    return new Intl.RelativeTimeFormat(page.lang, { numeric: 'auto' }).format(Math.round(diff / size), unit);
  }

  function tokenStatus(p, now) {
    if (!p) return { kind: 'idle', badge: 'badge.idle', msg: '' };
    if (p.error) return { kind: 'err', badge: 'badge.bad', msg: say(p.error) };
    const h = p.header;
    const str = (v) => (v === undefined || v === null || v === '' ? '' : typeof v === 'string' ? v : JSON.stringify(v));
    if (p.jwe) return { kind: 'warn', badge: 'badge.jwe', msg: ['JWE', str(h.alg), str(h.enc), tr('msg.encrypted')].filter(Boolean).join(' · ') };
    const c = isObj(p.payload) ? p.payload : {};
    const parts = [str(h.alg), str(h.typ)];
    let kind = 'ok', badge = 'badge.valid';
    if (isNum(c.exp) && now >= c.exp) {
      kind = 'err'; badge = 'badge.expired';
      parts.push(tr('msg.expired', relTime(c.exp - now)));
    } else if (isNum(c.nbf) && now < c.nbf) {
      kind = 'warn'; badge = 'badge.nbf';
      parts.push(tr('msg.nbf', relTime(c.nbf - now)));
    } else {
      parts.push(isNum(c.exp) ? tr('msg.expires', relTime(c.exp - now)) : tr('msg.noExp'));
    }
    if (h.alg === 'none') parts.push(tr('msg.unsigned'));
    if (p.payloadText !== undefined) parts.push(tr('note.text'));
    return { kind, badge, msg: parts.filter(Boolean).join(' · ') };
  }

  // ===== 渲染 =====
  function highlight(value) {
    const text = JSON.stringify(value, null, 2);
    const pre = el('pre', 'code-out');
    const span = (cls, s) => pre.appendChild(el('span', cls, s));
    let last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(text))) {
      if (m.index > last) pre.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1]) { span(m[2] ? 'tok-key' : 'tok-str', m[1]); if (m[2]) span('tok-punc', m[2]); }
      else if (m[3]) span('tok-num', m[3]);
      else if (m[4]) span('tok-bool', m[4]);
      else span('tok-punc', m[5]);
      last = TOKEN_RE.lastIndex;
    }
    if (last < text.length) pre.appendChild(document.createTextNode(text.slice(last)));
    return pre;
  }

  function section(titleKey, meta, ...content) {
    const sec = el('section', 'sec');
    const h = el('h3');
    h.append(el('span', null, tr(titleKey)));
    if (meta) h.append(el('span', 'meta', meta));
    sec.append(h, ...content);
    return sec;
  }

  function claimRow(name, ...cells) {
    const row = el('tr');
    row.append(el('th', null, name), el('td', 'desc', tr('claim.' + name)));
    const td = el('td');
    td.append(...cells);
    row.append(td);
    return row;
  }

  function timeCells(name, v, now) {
    const date = isNum(v) ? new Date(v * 1000) : null;
    if (!date || isNaN(date.getTime())) return [el('span', 'bad', tr('time.bad'))];
    const cells = [el('span', null, fmtDate(date)), el('span', 'rel', relTime(v - now))];
    let pill = null;
    if (name === 'exp') pill = now >= v ? ['err', 'badge.expired'] : ['ok', 'badge.valid'];
    if (name === 'nbf') pill = now < v ? ['warn', 'badge.nbf'] : ['ok', 'badge.valid'];
    if (pill) cells.push(el('span', 'badge ' + pill[0], tr(pill[1])));
    return cells;
  }

  function claimText(v) {
    if (typeof v === 'string') return v;
    if (Array.isArray(v) && v.every((x) => typeof x === 'string')) return v.join(', ');
    return JSON.stringify(v);
  }

  function table(rows) {
    const t = el('table', 'kv');
    t.append(...rows);
    return t;
  }

  function renderResult(now) {
    const out = $('out');
    const p = state.parsed;
    const nodes = [];
    $('outMeta').textContent = p && p.header ? (p.jwe ? 'JWE' : 'JWS') : '';
    if (!p) {
      out.replaceChildren(el('p', 'empty-hint', tr('empty.result')));
      return;
    }
    if (p.error) nodes.push(el('div', 'note err', say(p.error)));
    if (p.jwe) nodes.push(el('div', 'note', tr('note.jwe')));
    if (p.header && p.header.alg === 'none' && !p.jwe) nodes.push(el('div', 'note', tr('note.none')));
    if (p.header) nodes.push(section('sec.header', '', highlight(p.header)));
    if (p.payload !== undefined) nodes.push(section('sec.payload', '', highlight(p.payload)));
    if (p.payloadText !== undefined) {
      nodes.push(section('sec.payload', tr('note.text'), el('pre', 'code-out', p.payloadText)));
    }
    if (isObj(p.payload)) {
      const times = TIME_CLAIMS.filter((k) => k in p.payload);
      if (times.length) nodes.push(section('sec.times', '', table(times.map((k) => claimRow(k, ...timeCells(k, p.payload[k], now))))));
      const regs = REG_CLAIMS.filter((k) => k in p.payload);
      if (regs.length) nodes.push(section('sec.claims', '', table(regs.map((k) => claimRow(k, claimText(p.payload[k]))))));
    }
    if (p.sig) {
      nodes.push(section('sec.signature', tr('sec.bytes', p.sig.length), el('div', 'code-out', p.parts[2] || tr('sig.empty'))));
    }
    out.replaceChildren(...nodes);
  }

  function algSpec(alg) {
    const m = /^(HS|RS|PS|ES)(256|384|512)$/.exec(alg);
    if (m) {
      const hash = SHA[m[2]];
      if (m[1] === 'HS') return { family: 'hs', imp: { name: 'HMAC', hash }, ver: { name: 'HMAC' } };
      if (m[1] === 'RS') return { family: 'asym', imp: { name: 'RSASSA-PKCS1-v1_5', hash }, ver: { name: 'RSASSA-PKCS1-v1_5' } };
      if (m[1] === 'PS') return { family: 'asym', imp: { name: 'RSA-PSS', hash }, ver: { name: 'RSA-PSS', saltLength: m[2] / 8 } };
      return { family: 'asym', imp: { name: 'ECDSA', namedCurve: CURVE[m[2]] }, ver: { name: 'ECDSA', hash } };
    }
    if (alg === 'EdDSA' || alg === 'Ed25519') return { family: 'asym', imp: { name: 'Ed25519' }, ver: { name: 'Ed25519' } };
    return null;
  }

  function verifyMode() {
    const p = state.parsed;
    if (!p || p.error) return { mode: 'wait' };
    const alg = p.header.alg;
    if (p.jwe) return { mode: 'jwe', alg };
    if (typeof alg !== 'string' || !alg) return { mode: 'noalg', alg };
    if (alg === 'none') return { mode: 'none', alg };
    const spec = algSpec(alg);
    return spec ? { mode: spec.family, alg, spec } : { mode: 'unsupported', alg };
  }

  function renderVerifyArea() {
    const vm = verifyMode();
    const ph = {
      wait: () => tr('ph.keyWait'), jwe: () => tr('ph.keyJwe'), noalg: () => tr('vr.noAlg'), none: () => tr('ph.keyNone'),
      unsupported: () => tr('vr.unsupported', vm.alg), hs: () => tr('ph.keyHS', vm.alg), asym: () => tr('ph.keyAsym', vm.alg)
    };
    keyEl.placeholder = ph[vm.mode]();
    $('algMeta').textContent = vm.alg === undefined ? '' : 'alg: ' + (typeof vm.alg === 'string' ? vm.alg : JSON.stringify(vm.alg));
    $('b64Wrap').hidden = vm.mode !== 'hs';
  }

  function renderVerifyResult() {
    const box = $('vResult');
    box.hidden = !vResult;
    if (!vResult) return;
    const kind = { ok: 'ok', bad: 'err', na: 'warn' }[vResult.kind];
    $('vBadge').className = 'badge ' + kind;
    $('vBadge').textContent = tr('v.' + vResult.kind);
    $('vMsg').textContent = vResult.kind === 'ok' ? tr('v.okMsg', vResult.alg) : vResult.kind === 'bad' ? tr('v.badMsg') : say(vResult.reason);
  }

  function renderStatus(now) {
    const st = tokenStatus(state.parsed, now);
    const badge = $('badge');
    badge.className = 'badge ' + st.kind;
    badge.textContent = tr(st.badge);
    const msg = $('msg');
    msg.className = 'status-msg' + (st.kind === 'err' ? ' error' : st.kind === 'warn' ? ' note' : '');
    msg.textContent = st.msg;
  }

  function render() {
    const now = Date.now() / 1000;
    $('tokenMeta').textContent = state.token
      ? (state.bearer ? tr('meta.bearer') + ' · ' : '') + tr('meta.chars', state.token.length.toLocaleString())
      : '';
    renderResult(now);
    renderVerifyArea();
    renderVerifyResult();
    renderStatus(now);
  }

  function parseNow() {
    clearTimeout(timer);
    timer = null;
    const { token, bearer } = normalize(tokenEl.value);
    state = { token, bearer, parsed: token ? parseToken(token) : null };
    render();
  }

  function flush() {
    if (timer !== null) parseNow();
  }

  // ===== 验签 =====
  function b64Bytes(text) {
    const s = text.replace(/\s+/g, '').replace(/=+$/, '').replace(/-/g, '+').replace(/_/g, '/');
    if (/[^A-Za-z0-9+/]/.test(s) || s.length % 4 === 1) return null;
    const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
    return Uint8Array.from(bin, (c) => c.charCodeAt(0));
  }

  function publicJwk(jwk) {
    if (!isObj(jwk)) throw fail('vr.keyFormat');
    const fields = PUBLIC_JWK[jwk.kty];
    if (!fields) return jwk;
    const pub = { ext: true };
    fields.forEach((f) => { if (jwk[f] !== undefined) pub[f] = jwk[f]; });
    return pub;
  }

  function importHmac(spec, text) {
    const raw = $('optB64').checked ? b64Bytes(text) : new TextEncoder().encode(text);
    if (!raw) throw fail('vr.badB64');
    if (!raw.length) throw fail('vr.noKey');
    return crypto.subtle.importKey('raw', raw, spec.imp, false, ['verify']);
  }

  function importPublic(spec, text, kid) {
    const s = text.trim();
    if (s.startsWith('{')) {
      let jwk;
      try { jwk = JSON.parse(s); } catch (e) { throw fail('vr.badJson'); }
      if (isObj(jwk) && Array.isArray(jwk.keys)) {
        jwk = jwk.keys.find((k) => isObj(k) && kid !== undefined && k.kid === kid) || (jwk.keys.length === 1 ? jwk.keys[0] : null);
        if (!jwk) throw fail('vr.noJwk');
      }
      return crypto.subtle.importKey('jwk', publicJwk(jwk), spec.imp, false, ['verify']);
    }
    const m = /-----BEGIN ([A-Z0-9 ]+)-----([\s\S]*?)-----END \1-----/.exec(s);
    if (!m) throw fail('vr.keyFormat');
    if (/PRIVATE/.test(m[1])) throw fail('vr.private');
    if (m[1] !== 'PUBLIC KEY') throw fail('vr.pemType', m[1]);
    const der = b64Bytes(m[2]);
    if (!der) throw new Error('bad pem');
    return crypto.subtle.importKey('spki', der, spec.imp, false, ['verify']);
  }

  async function checkSignature() {
    const vm = verifyMode();
    const na = (...reason) => ({ kind: 'na', reason });
    const early = { wait: 'vr.noToken', jwe: 'vr.jwe', noalg: 'vr.noAlg', none: 'vr.none', unsupported: 'vr.unsupported' }[vm.mode];
    if (early) return na(early, vm.alg);
    if (!window.crypto || !window.crypto.subtle) return na('vr.noSubtle');
    if (!keyEl.value.trim()) return na('vr.noKey');
    const p = state.parsed;
    let key;
    try {
      key = await (vm.mode === 'hs' ? importHmac(vm.spec, keyEl.value) : importPublic(vm.spec, keyEl.value, p.header.kid));
    } catch (e) {
      if (e.reason) return na(...e.reason);
      if (e.name === 'NotSupportedError') return na('vr.unsupported', vm.alg);
      return na('vr.badKey', vm.alg);
    }
    const data = new TextEncoder().encode(p.parts[0] + '.' + p.parts[1]);
    let ok = false;
    try { ok = await crypto.subtle.verify(vm.spec.ver, key, p.sig, data); } catch (e) { ok = false; }
    return { kind: ok ? 'ok' : 'bad', alg: vm.alg };
  }

  async function verify() {
    flush();
    const seq = ++verifySeq;
    const res = await checkSignature();
    if (seq !== verifySeq) return;
    vResult = res;
    renderVerifyResult();
  }

  function resetVerify() {
    verifySeq++;
    vResult = null;
    renderVerifyResult();
  }

  // ===== 事件 =====
  tokenEl.addEventListener('input', () => {
    resetVerify();
    clearTimeout(timer);
    timer = setTimeout(parseNow, 150);
  });
  keyEl.addEventListener('input', resetVerify);
  keyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); verify(); }
  });
  $('optB64').addEventListener('change', resetVerify);
  $('btnVerify').addEventListener('click', verify);
  $('btnSample').addEventListener('click', () => {
    tokenEl.value = SAMPLE_TOKEN;
    keyEl.value = SAMPLE_SECRET;
    $('optB64').checked = false;
    resetVerify();
    parseNow();
  });
  $('btnClear').addEventListener('click', () => {
    tokenEl.value = '';
    keyEl.value = '';
    resetVerify();
    parseNow();
    tokenEl.focus();
    page.toast(tr('toast.cleared'));
  });
  $('btnCopyHeader').addEventListener('click', () => {
    flush();
    const p = state.parsed;
    page.copy(p && p.header ? JSON.stringify(p.header, null, 2) : '');
  });
  $('btnCopyPayload').addEventListener('click', () => {
    flush();
    const p = state.parsed;
    if (p && p.payload !== undefined) page.copy(JSON.stringify(p.payload, null, 2));
    else page.copy(p && p.payloadText !== undefined ? p.payloadText : '');
  });

  render();
})();
</script>
</body>
</html>
