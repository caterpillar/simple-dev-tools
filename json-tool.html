<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 工具 · 格式化 / 压缩 / 转义 / JSONPath</title>
<style>
  :root, :root[data-theme="tokyo-night"] {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1b2029;
    --border: #262d3a;
    --hover: #232a36;
    --hover-border: #33405a;
    --text: #d7dce5;
    --muted: #7c8798;
    --ln: #556178;
    --placeholder: #556174;
    --selection: rgba(79, 157, 255, .32);
    --accent: #4f9dff;
    --accent-2: #2d7fe0;
    --on-accent: #ffffff;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --warn: #f5b942;
    --key: #7aa2f7;
    --str: #9ece6a;
    --num: #ff9e64;
    --bool: #bb9af7;
    --punc: #565f6e;
    --shadow: rgba(0, 0, 0, .45);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --ed-font-size: 13px;
    --ed-line-height: 21px;
    --ed-pad-y: 10px;
    --ed-pad-x: 12px;
    /* 行号栏宽度，按编辑器字号缩放，可容纳 5 位数 */
    --gutter-w: 3.6em;
    /* 工具栏控件尺寸，默认「适中」；由设置面板的 data-size 覆盖 */
    --ctl-h: 28px;
    --ctl-fs: 13px;
    --ctl-px: 9px;
    --ctl-r: 6px;
    --tb-gap: 4px;
    --tb-pad: 5px;
    --chk-fs: 12.5px;
    --split-left: 1.6fr;
    --split-right: 1fr;
    --splitter-size: 8px;
  }

  :root[data-size="sm"] {
    --ctl-h: 24px; --ctl-fs: 12px; --ctl-px: 6px; --ctl-r: 5px;
    --tb-gap: 3px; --tb-pad: 4px; --chk-fs: 11.5px;
  }
  :root[data-size="md"] {
    --ctl-h: 28px; --ctl-fs: 13px; --ctl-px: 9px; --ctl-r: 6px;
    --tb-gap: 4px; --tb-pad: 5px; --chk-fs: 12.5px;
  }
  :root[data-size="lg"] {
    --ctl-h: 33px; --ctl-fs: 14px; --ctl-px: 12px; --ctl-r: 7px;
    --tb-gap: 5px; --tb-pad: 6px; --chk-fs: 13.5px;
  }
  :root[data-size="xl"] {
    --ctl-h: 39px; --ctl-fs: 15.5px; --ctl-px: 15px; --ctl-r: 8px;
    --tb-gap: 6px; --tb-pad: 7px; --chk-fs: 15px;
  }

  :root[data-theme="dracula"] {
    --bg: #282a36; --panel: #21222c; --panel-2: #343746; --border: #44475a;
    --hover: #3a3d4d; --hover-border: #565a75;
    --text: #f8f8f2; --muted: #8b93b8; --ln: #6b7197; --placeholder: #6c7292;
    --selection: rgba(189, 147, 249, .3);
    --accent: #bd93f9; --accent-2: #7957d5; --on-accent: #ffffff;
    --ok: #50fa7b; --err: #ff5555; --warn: #f1fa8c;
    --key: #8be9fd; --str: #f1fa8c; --num: #bd93f9; --bool: #ff79c6; --punc: #6272a4;
    --shadow: rgba(0, 0, 0, .5);
  }

  :root[data-theme="monokai"] {
    --bg: #272822; --panel: #1e1f1c; --panel-2: #32332c; --border: #3e3d32;
    --hover: #3e3d32; --hover-border: #55564a;
    --text: #f8f8f2; --muted: #9a967f; --ln: #717263; --placeholder: #707261;
    --selection: rgba(166, 226, 46, .25);
    --accent: #a6e22e; --accent-2: #86b91f; --on-accent: #1e1f1c;
    --ok: #a6e22e; --err: #f93079; --warn: #e6db74;
    --key: #fa4989; --str: #e6db74; --num: #ae81ff; --bool: #fd971f; --punc: #75715e;
    --shadow: rgba(0, 0, 0, .5);
  }

  :root[data-theme="nord"] {
    --bg: #2e3440; --panel: #272c36; --panel-2: #3b4252; --border: #434c5e;
    --hover: #434c5e; --hover-border: #55607a;
    --text: #d8dee9; --muted: #8b98b0; --ln: #6f7d98; --placeholder: #717d94;
    --selection: rgba(136, 192, 208, .28);
    --accent: #88c0d0; --accent-2: #5e81ac; --on-accent: #ffffff;
    --ok: #a3be8c; --err: #ca7d85; --warn: #ebcb8b;
    --key: #81a1c1; --str: #a3be8c; --num: #b690af; --bool: #88c0d0; --punc: #63708b;
    --shadow: rgba(0, 0, 0, .45);
  }

  :root[data-theme="solarized-dark"] {
    --bg: #002b36; --panel: #00252e; --panel-2: #073642; --border: #0f4552;
    --hover: #0b414f; --hover-border: #14505f;
    --text: #93a1a1; --muted: #7a9497; --ln: #467788; --placeholder: #4e7588;
    --selection: rgba(38, 139, 210, .3);
    --accent: #268bd2; --accent-2: #1f6fad; --on-accent: #ffffff;
    --ok: #859900; --err: #e35b58; --warn: #b58900;
    --key: #2f93d9; --str: #2aa198; --num: #dd629d; --bool: #8387cd; --punc: #586e75;
    --shadow: rgba(0, 0, 0, .5);
  }

  :root[data-theme="github-light"] {
    --bg: #ffffff; --panel: #f6f8fa; --panel-2: #ffffff; --border: #d0d7de;
    --hover: #eef1f4; --hover-border: #b8c0c8;
    --text: #1f2328; --muted: #656d76; --ln: #8e95a0; --placeholder: #8e95a0;
    --selection: rgba(9, 105, 218, .18);
    --accent: #0969da; --accent-2: #0969da; --on-accent: #ffffff;
    --ok: #1a7f37; --err: #cf222e; --warn: #9a6700;
    --key: #0550ae; --str: #0a3069; --num: #953800; --bool: #cf222e; --punc: #6e7781;
    --shadow: rgba(31, 35, 40, .18);
  }

  :root[data-theme="solarized-light"] {
    --bg: #fdf6e3; --panel: #f5efdc; --panel-2: #fdf6e3; --border: #ddd6c1;
    --hover: #eee8d5; --hover-border: #d3cbb3;
    --text: #465a61; --muted: #5f6f74; --ln: #9a8e68; --placeholder: #998e74;
    --selection: rgba(38, 139, 210, .2);
    --accent: #268bd2; --accent-2: #1f6fad; --on-accent: #ffffff;
    --ok: #647400; --err: #c22a26; --warn: #90650a;
    /* 浅底下沿用原版 Solarized 亮色会偏淡，这里整体压深以保证可读性 */
    --key: #1f6fad; --str: #1f7a6d; --num: #c02a72; --bool: #585db5; --punc: #7f8c8d;
    --shadow: rgba(88, 110, 117, .2);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 非中文语言下，等 applyLang 填完文案再显示，避免闪一下中文 */
  html.i18n-pending body { visibility: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== 第一栏：标题栏 ===== */
  header.titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 15px; font-weight: 650; letter-spacing: .3px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .titlebar-right { display: flex; align-items: center; gap: 8px; }

  /* 主题选择：图标 + 下拉，不再占额外文字与色板空间 */
  .theme-pick { position: relative; display: inline-flex; align-items: center; }
  .theme-pick svg {
    position: absolute; left: 7px; width: 14px; height: 14px;
    color: var(--muted); pointer-events: none;
  }
  .theme-pick select { height: 24px; padding: 3px 8px 3px 26px; font-size: 12px; line-height: 1.3; border-radius: 5px; }

  /* 设置按钮与弹出面板 */
  .settings-wrap { position: relative; display: inline-flex; }
  #btnSettings {
    height: 24px; width: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 5px; color: var(--muted);
  }
  #btnSettings:hover, #btnSettings.on { color: var(--text); background: var(--hover); border-color: var(--hover-border); }
  #btnSettings svg { width: 15px; height: 15px; display: block; }

  .settings-pop {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
    min-width: 232px;
    max-height: calc(100dvh - 60px);
    overflow-y: auto;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--hover-border);
    border-radius: 8px;
    box-shadow: 0 10px 28px var(--shadow);
  }
  .settings-pop[hidden] { display: none; }
  .set-title { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .set-title-2 { margin-top: 12px; }
  .lang-sel { width: 100%; font-size: 12px; line-height: 1.3; padding: 4px 7px; border-radius: 5px; }
  .json-settings { margin: 12px 0 0; padding: 10px 0 0; border: 0; border-top: 1px solid var(--border); }
  .json-settings legend { padding: 0 6px 0 0; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }
  .set-row select { font-size: 12px; padding: 4px 7px; border-radius: 5px; }
  .json-settings .chk { display: flex; gap: 6px; margin-top: 10px; font-size: 12px; }
  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1 1 0; min-width: 0;
    font-size: 12px; line-height: 1.2;
    padding: 5px 2px; border-radius: 5px;
    background: var(--bg); color: var(--muted);
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    background: var(--accent-2); border-color: var(--accent-2);
    color: var(--on-accent); font-weight: 600;
  }
  .set-hint { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.5; }

  button, select, input[type=text] {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  button:hover, select:hover { background: var(--hover); border-color: var(--hover-border); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  button.primary { background: var(--accent-2); border-color: var(--accent-2); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { background: var(--accent); border-color: var(--accent); }
  label.chk {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap;
  }
  label.chk input { accent-color: var(--accent); cursor: pointer; margin: 0; }

  /* ===== 第二栏：主工作区（左右两栅栏） ===== */
  main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: minmax(0, var(--split-left)) var(--splitter-size) minmax(0, var(--split-right));
    background: var(--border);
    min-height: 0;
  }
  .pane-splitter {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    cursor: col-resize;
    touch-action: none;
    user-select: none;
  }
  .pane-splitter::after {
    content: "";
    width: 2px;
    height: 36px;
    border-radius: 2px;
    background: var(--muted);
  }
  .pane-splitter:hover, .pane-splitter:focus-visible, body.resizing .pane-splitter {
    background: var(--hover);
  }
  .pane-splitter:hover::after, .pane-splitter:focus-visible::after, body.resizing .pane-splitter::after {
    background: var(--accent);
  }
  .pane-splitter:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1px; }
    .pane-splitter { display: none; }
  }
  .pane { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* 左右两栏工具栏共用同一套尺寸与风格，min-height 保证两栏高度一致 */
  .toolbar {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; align-content: center;
    gap: var(--tb-gap);
    padding: var(--tb-pad) calc(var(--tb-pad) + 1px);
    /* 单行高度：控件 + 上下内边距 + 1px 下边框；折行时自然增高 */
    min-height: calc(var(--ctl-h) + var(--tb-pad) * 2 + 1px);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .toolbar button, .toolbar select, .toolbar input[type=text] {
    font-size: var(--ctl-fs);
    height: var(--ctl-h);
    padding: 0 var(--ctl-px);
    border-radius: var(--ctl-r);
    line-height: 1.2;
  }
  .toolbar input[type=text] { font-family: var(--mono); cursor: text; }
  .toolbar input[type=text]::placeholder { color: var(--placeholder); font-family: var(--mono); }
  .toolbar label.chk { font-size: var(--chk-fs); }
  .toolbar .fold-icon {
    width: var(--ctl-h);
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .fold-icon svg { width: 1.2em; height: 1.2em; }
  /* flex-basis 必须给小值：auto 会用 input 的固有宽度（约 170px），
     在 flex-wrap 下换行优先于收缩，会把整行顶爆而不是让输入框变窄 */
  .toolbar .grow { flex: 1 1 60px; min-width: 90px; }
  .jp-input-wrap { position: relative; display: inline-flex; }
  .jp-input-wrap #qInput { width: 100%; min-width: 0; }
  .jp-suggest {
    /* fixed：工具栏可能因大字号/长语言折成多行，候选必须定位到整个工具栏下方，不能相对第一行输入框 */
    position: fixed; left: 0; top: 0; z-index: 70;
    width: 260px; min-width: 220px; max-height: 264px;
    padding: 4px;
    overflow: hidden;
    background: var(--panel-2);
    border: 1px solid var(--hover-border);
    border-radius: 7px;
    box-shadow: 0 10px 28px var(--shadow);
  }
  .jp-suggest[hidden] { display: none; }
  .jp-options { max-height: 220px; overflow: auto; }
  .jp-opt {
    display: flex; align-items: center; gap: 8px;
    min-height: 27px; padding: 4px 7px;
    border-radius: 5px;
    cursor: pointer; user-select: none;
    font-family: var(--mono); font-size: 12px;
  }
  .jp-opt:hover, .jp-opt.active { background: var(--hover); }
  .jp-opt .key { color: var(--key); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jp-opt .preview { margin-left: auto; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
  .jp-hint {
    padding: 5px 7px 2px;
    margin-top: 3px;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 10.5px; line-height: 1.4;
    white-space: nowrap;
  }
  .tb-group { display: flex; align-items: center; gap: inherit; flex: 0 0 auto; }
  .tb-sep { width: 1px; height: calc(var(--ctl-h) - 9px); background: var(--border); margin: 0 1px; flex: 0 0 auto; }

  /* 左栏：JSON 编辑/展示区（自动换行） */
  .editor { flex: 1 1 auto; position: relative; min-height: 0; }
  .code-area { position: absolute; inset: 0; min-width: 0; overflow: hidden; }
  /* 状态线固定在编辑区外缘，不占用 CodeMirror 行号槽。 */
  .code-area::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 2px; z-index: 5;
    pointer-events: none;
  }
  .code-area.state-ok::after { background: var(--ok); }
  .code-area.state-err::after { background: var(--err); }

  /* 行号：每个逻辑行渲染成一个 div，用 CSS 计数器编号并绝对定位到左侧预留区。
     div 的高度天然等于该逻辑行折行后的总高度，因此编号自动对齐它的首个视觉行 */
  #qResult { counter-reset: ln; }
  .ln {
    position: relative;
    counter-increment: ln;
    min-height: var(--ed-line-height);
  }
  .ln::before {
    content: attr(data-line);
    position: absolute;
    left: calc(-1 * var(--gutter-w));
    width: calc(var(--gutter-w) - 10px);
    text-align: right;
    color: var(--ln);
    user-select: none;
    pointer-events: none;
  }
  .fold-actions { display: inline-flex; gap: inherit; flex: 0 0 auto; }
  .fold-actions[hidden] { display: none; }
  .fold-toggle {
    position: absolute;
    left: calc(-1 * var(--gutter-w) + 1px);
    top: 3px;
    width: 14px; height: 15px; padding: 0;
    border: 0; background: transparent; color: var(--muted);
    font: 11px/15px var(--mono); text-align: center;
    cursor: pointer; user-select: none;
    pointer-events: auto;
  }
  .fold-toggle:hover { color: var(--text); }
  .ln.folded::after {
    content: attr(data-fold-tail);
    color: var(--muted);
    font-style: italic;
  }
  .ln.fold-hidden { display: none; }
  /* 无行号的场景（错误信息、空闲提示、超大文本）收回预留宽度 */
  #qResult.no-gutter { padding-left: var(--ed-pad-x); }

  .k { color: var(--key); }
  .s { color: var(--str); }
  .n { color: var(--num); }
  .b { color: var(--bool); }
  .p, .c { color: var(--punc); }
  .cm { color: var(--muted); font-style: italic; }
  .an { color: var(--warn); }

  /* 右栏：结果展示区（按格式着色 + 行号） */
  .result-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #qResult {
    position: absolute; inset: 0;
    margin: 0; overflow: auto;
    background: transparent; color: var(--text);
    font-family: var(--mono);
    font-size: var(--ed-font-size);
    line-height: var(--ed-line-height);
    padding: var(--ed-pad-y) var(--ed-pad-x) var(--ed-pad-y) calc(var(--gutter-w) + var(--ed-pad-x));
    white-space: pre-wrap; overflow-wrap: break-word;
    tab-size: 2;
    user-select: text;
    cursor: text;
  }
  #qResult.err { color: var(--err); }
  #qResult.empty { color: var(--placeholder); }

  /* 复制分裂按钮：结果是一维标量列表时才长出下拉箭头 */
  .copy-split { position: relative; display: inline-flex; flex: 0 0 auto; }
  .copy-split .caret {
    display: none;
    align-items: center; justify-content: center;
    width: calc(var(--ctl-h) * 0.62);
    padding: 0;
    border-top-left-radius: 0; border-bottom-left-radius: 0;
    border-left: 0;
    margin-left: 1px;
  }
  .copy-split .caret svg { width: 9px; height: 9px; display: block; }
  .copy-split.split .caret { display: inline-flex; }
  .copy-split.split > button:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  /* 左栏可能折成多行，菜单用 fixed 脱离工具栏滚动尺寸，并由 JS 防止越出视口 */
  .copy-menu.left-menu { position: fixed; right: auto; left: 0; top: 0; }
  .copy-menu {
    position: absolute; top: calc(100% + 5px); right: 0; z-index: 60;
    min-width: 186px; padding: 4px;
    display: flex; flex-direction: column; gap: 2px;
    background: var(--panel-2);
    border: 1px solid var(--hover-border);
    border-radius: 7px;
    box-shadow: 0 10px 28px var(--shadow);
  }
  .copy-menu[hidden] { display: none; }
  .copy-menu button {
    width: 100%; height: auto; text-align: left;
    border: 0; background: transparent; border-radius: 5px;
    font-size: var(--ctl-fs); padding: 5px 8px;
  }
  .copy-menu button:hover { background: var(--hover); }
  .copy-menu .hint {
    padding: 5px 8px 3px;
    font-family: var(--mono); font-size: 11px; line-height: 1.45;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== 第三栏：状态栏（保持不变） ===== */
  footer {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
    padding: 7px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
    min-height: 34px;
  }
  footer .stat b { color: var(--text); font-weight: 600; }
  .badge {

  #qSummary {

  #qSummary.err { color: var(--err); }
  #qSummary b { color: var(--text); font-weight: 600; }

  .toast {

<script>
  // 首屏渲染前应用已保存的主题、按钮尺寸与语言，避免闪一下默认样式
  try {
    var d = document.documentElement;
    var th = localStorage.getItem('json-tool-theme');
    if (th) d.setAttribute('data-theme', th);
    var sz = localStorage.getItem('json-tool-btnsize');
    if (sz) d.setAttribute('data-size', sz);
    var split = Number(localStorage.getItem('json-tool-split-ratio'));
    if (Number.isFinite(split) && split >= 0.2 && split <= 0.8) {
      d.style.setProperty('--split-left', split + 'fr');
      d.style.setProperty('--split-right', (1 - split) + 'fr');
    }

    var lg = localStorage.getItem('json-tool-lang');
    if (!lg) {
      // 没有保存值时按浏览器语言推断（与主脚本的 detectLang 保持一致）
      var ok = ['zh-CN', 'zh-TW', 'en', 'ja', 'ko', 'es', 'fr', 'de'];
      var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
      for (var i = 0; i < prefs.length && !lg; i++) {
        var full = String(prefs[i]), base = full.toLowerCase().split('-')[0];
        if (ok.indexOf(full) >= 0) { lg = full; continue; }
        if (base === 'zh') { lg = /(^|-)(tw|hk|mo|hant)(-|$)/i.test(full) ? 'zh-TW' : 'zh-CN'; continue; }
        for (var j = 0; j < ok.length; j++) { if (ok[j].split('-')[0] === base) { lg = ok[j]; break; } }
      }
      lg = lg || 'en';
    }
    d.setAttribute('data-lang', lg);
    d.lang = lg;

    // 静态文案是中文，非中文语言下先隐藏，等 applyLang 填完再显示；
    // 1.5s 兜底，万一脚本出错也不会白屏
    if (lg !== 'zh-CN') {
      d.classList.add('i18n-pending');
      setTimeout(function () { d.classList.remove('i18n-pending'); }, 1500);
    }
  } catch (e) { /* 隐私模式下 localStorage 不可用，用默认值 */ }
</script>

  let lang = 'zh-CN';

  function tr(key) {
    const dict = I18N[lang] || I18N['zh-CN'];
    let s = dict[key];
    if (s === undefined) s = I18N['zh-CN'][key];
    if (s === undefined) return key;
    for (let i = 1; i < arguments.length; i++) {
      s = s.split('{' + (i - 1) + '}').join(arguments[i]);
    }
    return s;
  }

  // 按钮提示 = 按钮文案 + 快捷键，避免为每种语言重复维护一遍
  const tip = (key, sc) => (sc ? tr(key) + ' (' + sc + ')' : tr(key));

  // zh-TW / zh-HK / zh-MO / zh-Hant → 繁體，其餘 zh（含 zh-CN、zh-SG、zh-Hans）→ 簡體
  function zhVariant(full) {
    return /(^|-)(tw|hk|mo|hant)(-|$)/i.test(full) ? 'zh-TW' : 'zh-CN';
  }

  // 浏览器语言 → 受支持语言：先整体匹配，再按主标签匹配，都不中则回退英文
  function detectLang() {
    const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
    const ids = LANGS.map((l) => l.id);
    for (const p of prefs) {
      const full = String(p);
      if (ids.indexOf(full) >= 0) return full;
      const base = full.toLowerCase().split('-')[0];
      if (base === 'zh') return zhVariant(full);
      const hit = ids.find((id) => id.split('-')[0] === base);
      if (hit) return hit;
    }
    return 'en';
  }

  // 超过该规模时关闭语法高亮，只渲染纯文本，避免输入卡顿
  const MAX_HL_CHARS = 300000;
  const MAX_MATCHES = 2000;
  const MAX_FOLD_REGIONS = 2000;

  /* ---------- 基础工具 ---------- */

  const escHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function fastEsc(s) {
    if (s.indexOf('&') < 0 && s.indexOf('<') < 0 && s.indexOf('>') < 0) return s;
    return escHtml(s);
  }

  function byteLen(s) {
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      n += c < 0x80 ? 1 : c < 0x800 ? 2 : (c >= 0xd800 && c <= 0xdbff) ? 4 : 3;
    }
    return n;
  }

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 2 : 1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }

  function countLines(text) {
    let n = 1;
    for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) n++;
    return n;
  }

  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function setMsg(text, kind) {
    msg.className = kind || '';
    msg.innerHTML = text || '';
  }

  function setBadge(text, kind) {
    badge.textContent = text;
    badge.className = 'badge ' + kind;
  }

  /* ---------- 语法高亮 ---------- */

  function isNumChar(c) {
    return (c >= '0' && c <= '9') || c === 'e' || c === 'E' || c === '+' || c === '-' || c === '.';
  }

  function highlight(json) {
    const parts = [];
    let i = 0;
    const n = json.length;
    while (i < n) {
      const c = json[i];
      if (c === '"') {
        let j = i + 1;
        while (j < n) {
          const d = json[j];
          if (d === '\\') { j += 2; continue; }
          if (d === '"') { j++; break; }
          j++;
        }
        if (j > n) j = n;
        let k = j;
        while (k < n && (json[k] === ' ' || json[k] === '\t')) k++;
        parts.push('<span class="', json[k] === ':' ? 'k' : 's', '">', fastEsc(json.slice(i, j)), '</span>');
        i = j;
        continue;
      }
      if (c === '-' || (c >= '0' && c <= '9')) {
        let j = i;
        while (j < n && isNumChar(json[j])) j++;
        parts.push('<span class="n">', fastEsc(json.slice(i, j)), '</span>');
        i = j;
        continue;
      }
      if (c === 't' || c === 'f' || c === 'n') {
        const w = json.startsWith('true', i) ? 'true'
          : json.startsWith('false', i) ? 'false'
          : json.startsWith('null', i) ? 'null' : null;
        if (w) { parts.push('<span class="b">', w, '</span>'); i += w.length; continue; }
      }
      if (c === '{' || c === '}' || c === '[' || c === ']') { parts.push('<span class="p">', c, '</span>'); i++; continue; }
      if (c === ':' || c === ',') { parts.push('<span class="c">', c, '</span>'); i++; continue; }
      parts.push(fastEsc(c));
      i++;
    }
    return parts.join('');
  }

  // 按行切分高亮后的 HTML：跨行的 span 在行尾闭合、下一行重新打开，
  // 这样每个逻辑行都能独立成一个 div，行号才能跟着折行高度走
  function splitHtmlLines(html) {
    const out = [];
    const open = [];
    let cur = '', last = 0, m;
    const re = /<span class="([a-z]+)">|<\/span>|\n/g;
    while ((m = re.exec(html)) !== null) {
      cur += html.slice(last, m.index);
      last = m.index + m[0].length;
      if (m[0] === '\n') {
        out.push(cur + '</span>'.repeat(open.length));
        cur = open.map((c) => '<span class="' + c + '">').join('');
      } else if (m[1]) {
        open.push(m[1]);
        cur += m[0];
      } else {
        open.pop();
        cur += m[0];
      }
    }
    out.push(cur + html.slice(last));
    return out;
  }

  function toLineDivs(html) {
    const lines = splitHtmlLines(html);
    const parts = new Array(lines.length);
    for (let i = 0; i < lines.length; i++) parts[i] = '<div class="ln" data-line="' + (i + 1) + '">' + lines[i] + '</div>';
    return parts.join('');
  }

  function createFoldButton(region, onToggle) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fold-toggle';
    btn.textContent = '▾';
    btn.dataset.line = String(region.start);
    btn.title = tr('btn.collapseAll');
    btn.setAttribute('aria-label', tr('btn.collapseAll'));
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); onToggle(region.start); });
    return btn;
  }

  function decorateFoldControls(container, regions, onToggle) {
    const lines = container.querySelectorAll('.ln');
    for (const region of regions) {
      const line = lines[region.start];
      if (!line) continue;
      line.dataset.foldTail = region.char === '{' ? ' … }' : ' … ]';
      line.prepend(createFoldButton(region, onToggle));
    }
  }

  /* ---------- 统计与校验 ---------- */

  function walk(v, depth) {
    const isArr = Array.isArray(v);
    const isObj = !isArr && v !== null && typeof v === 'object';
    if (!isArr && !isObj) return { keys: 0, depth: depth };
    const ks = isArr ? null : Object.keys(v);
    let keys = ks ? ks.length : 0;
    let max = depth;
    const len = isArr ? v.length : ks.length;
    for (let i = 0; i < len; i++) {
      const c = isArr ? v[i] : v[ks[i]];
      if (c === null || typeof c !== 'object') continue;
      const r = walk(c, depth + 1);
      keys += r.keys;
      if (r.depth > max) max = r.depth;
    }
    return { keys: keys, depth: max };
  }

  function posToLineCol(text, pos) {
    let line = 1, last = 0;
    const limit = Math.min(pos, text.length);
    for (let i = 0; i < limit; i++) {
      if (text.charCodeAt(i) === 10) { line++; last = i + 1; }
    }
    return { line: line, col: pos - last + 1 };
  }

  function parseError(text, err) {
    const m = String(err.message);
    let pos = -1, line = 0, col = 0;
    const lc = m.match(/\(line (\d+) column (\d+)\)/);
    const pm = m.match(/position (\d+)/);
    if (lc) { line = +lc[1]; col = +lc[2]; }
    else if (pm) { pos = +pm[1]; }

    if (pos >= 0) {
      const r = posToLineCol(text, pos);
      line = r.line; col = r.col;
    } else if (line > 0) {
      const ls = text.split('\n');
      pos = 0;
      for (let i = 0; i < line - 1 && i < ls.length; i++) pos += ls[i].length + 1;
      pos += col - 1;
    }
    return {
      message: m.replace(/\s*at position \d+.*$/, '').replace(/^JSON\.parse:\s*/, ''),
      line: line, col: col, pos: Math.max(0, pos)
    };
  }

  function selectPos(pos) {
    if (pos != null && pos >= 0) editor.selectError(pos);
  }

  function setEditorValidity(state) {
    codeArea.classList.toggle('state-ok', state === 'ok');
    codeArea.classList.toggle('state-err', state === 'err');
  }

  function updateStats(parsed) {
    const t = editor.getText();
    $('stChars').textContent = t.length.toLocaleString('en-US');
    $('stLines').textContent = countLines(t).toLocaleString('en-US');
    $('stBytes').textContent = fmtBytes(byteLen(t));
    if (parsed === undefined) {
      $('stDepth').textContent = '-';
      $('stKeys').textContent = '-';
    } else {
      const r = walk(parsed, 1);
      $('stDepth').textContent = r.depth;
      $('stKeys').textContent = r.keys.toLocaleString('en-US');
    }
  }

  // 返回解析结果；解析失败返回 { __error }；空内容返回 undefined
  function validate() {
    const text = editor.getText();
    if (!text.trim()) {
      setEditorValidity('idle');
      setBadge(tr('badge.idle'), 'idle');
      updateStats(undefined);
      return undefined;
    }
    try {
      const v = JSON.parse(text);
      setEditorValidity('ok');
      setBadge(tr('badge.ok'), 'ok');
      updateStats(v);
      return v;
    } catch (e) {
      const info = parseError(text, e);
      setEditorValidity('err');
      setBadge(tr('badge.err'), 'err');
      updateStats(undefined);
      setMsg(escHtml(tr('msg.valErr', info.line, info.col, info.message)) +
        ' &nbsp;<a id="jumpErr">' + tr('link.locateErr') + '</a>', 'error');
      const a = $('jumpErr');
      if (a) a.onclick = () => selectPos(info.pos);
      return { __error: info };
    }
  }

  function syncStats() {
    let v;
    try { v = JSON.parse(editor.getText()); } catch (e) { v = undefined; }
    updateStats(v);
  }

  /* ---------- JSONPath ---------- */

  const IDENT = /^[A-Za-z_$][A-Za-z0-9_$\-\u0080-\uffff]*$/;

  function pathKey(p, k) {
    return IDENT.test(k) ? p + '.' + k : p + '["' + String(k).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]';
  }
  const pathIdx = (p, i) => p + '[' + i + ']';

  function readName(s, i) {
    const q = s[i];
    if (q === "'" || q === '"') {
      let j = i + 1;
      while (j < s.length && s[j] !== q) { if (s[j] === '\\') j++; j++; }
      if (j >= s.length) throw jpErr(i + 1, 'jp.quote');
      return { name: s.slice(i + 1, j), end: j + 1 };
    }
    let j = i;
    while (j < s.length && s[j] !== '.' && s[j] !== '[' && s[j] !== ']') j++;
    const name = s.slice(i, j).trim();
    return { name: name, end: i + name.length };
  }

  function findCloseBracket(s, i) {
    let q = null;
    for (let j = i + 1; j < s.length; j++) {
      const c = s[j];
      if (q) {
        if (c === '\\') { j++; continue; }
        if (c === q) q = null;
        continue;
      }
      if (c === "'" || c === '"') { q = c; continue; }
      if (c === ']') return j;
    }
    return -1;
  }

  // 按顶层分隔符切分，跳过引号内的内容
  function splitBracket(s, ch) {
    const parts = [];
    let q = null, cur = '';
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) {
        cur += c;
        if (c === '\\') { cur += s[++i] || ''; continue; }
        if (c === q) q = null;
        continue;
      }
      if (c === "'" || c === '"') { q = c; cur += c; continue; }
      if (c === ch) { parts.push(cur); cur = ''; continue; }
      cur += c;
    }
    parts.push(cur);
    return parts;
  }

  // 判断首尾括号是否互相配对，避免把 "(@.a) || (@.b)" 当成整体包裹
  function isWrapped(e) {
    if (e.length < 2 || e[0] !== '(' || e[e.length - 1] !== ')') return false;
    let depth = 0, q = null;
    for (let i = 0; i < e.length; i++) {
      const c = e[i];
      if (q) { if (c === '\\') { i++; continue; } if (c === q) q = null; continue; }
      if (c === "'" || c === '"') { q = c; continue; }
      if (c === '(') depth++;
      else if (c === ')') { depth--; if (depth === 0 && i !== e.length - 1) return false; }
    }
    return depth === 0;
  }

  const unwrap = (e) => { let s = e.trim(); while (isWrapped(s)) s = s.slice(1, -1).trim(); return s; };

  // JSONPath 报错统一带上出错位置
  const jpErr = (at, key, a) => new Error(tr('jp.pos', at, a === undefined ? tr(key) : tr(key, a)));

  function parseBracket(inner, at) {
    if (inner === '') throw jpErr(at, 'jp.emptyBr');
    if (inner === '*') return { t: 'wild' };
    if (inner[0] === '?') {
      const src = inner.slice(1).trim();
      if (!unwrap(src)) throw jpErr(at, 'jp.emptyFilter');
      return { t: 'filter', src: src, at: at };
    }
    const colon = splitBracket(inner, ':');
    if (colon.length > 1) {
      if (colon.length > 3) throw jpErr(at, 'jp.slice3');
      const num = (x) => (x.trim() === '' ? undefined : Number(x.trim()));
      const parts = colon.map(num);
      if (parts.some((x) => x !== undefined && Number.isNaN(x))) throw jpErr(at, 'jp.sliceInt');
      if (parts[2] === 0) throw jpErr(at, 'jp.slice0');
      return { t: 'slice', from: parts[0], to: parts[1], step: parts[2] === undefined ? 1 : parts[2] };
    }
    const comma = splitBracket(inner, ',');
    if (comma.length > 1) {
      const parts = comma.map((x) => x.trim()).filter((x) => x !== '');
      if (!parts.length) throw jpErr(at, 'jp.emptyBr');
      if (parts.every((x) => /^-?\d+$/.test(x))) return { t: 'unionIdx', idx: parts.map(Number) };
      return { t: 'unionKeys', keys: parts.map((x) => (/^['"]/.test(x) ? readName(x, 0).name : x)) };
    }
    if (/^['"]/.test(inner)) return { t: 'child', key: readName(inner, 0).name };
    if (/^-?\d+$/.test(inner)) return { t: 'index', idx: Number(inner) };
    return { t: 'child', key: inner };
  }

  function parseJsonPath(input) {
    let s = String(input).trim();
    if (!s) throw new Error(tr('jp.need'));
    // $ 前缀与紧随其后的 . 都可省略
    if (s[0] !== '$') s = s[0] === '.' ? '$' + s : '$.' + s;
    const steps = [];
    const n = s.length;
    let i = 1;
    while (i < n) {
      if (s[i] === '.') {
        if (s[i + 1] === '.') {
          i += 2;
          if (s[i] === '*') { steps.push({ t: 'descendWild' }); i++; continue; }
          if (s[i] === '[') { steps.push({ t: 'descendWild' }); continue; }
          const r = readName(s, i);
          if (!r.name) throw jpErr(i + 1, 'jp.ddName');
          steps.push({ t: 'descend', key: r.name });
          i = r.end;
          continue;
        }
        i++;
        if (s[i] === '*') { steps.push({ t: 'wild' }); i++; continue; }
        if (s[i] === '[') continue;      // $.[0] 这种写法
        const r = readName(s, i);
        if (!r.name) throw jpErr(i + 1, 'jp.dotName');
        steps.push({ t: 'child', key: r.name });
        i = r.end;
        continue;
      }
      if (s[i] === '[') {
        const close = findCloseBracket(s, i);
        if (close < 0) throw jpErr(i + 1, 'jp.bracket');
        steps.push(parseBracket(s.slice(i + 1, close).trim(), i + 2));
        i = close + 1;
        continue;
      }
      throw jpErr(i + 1, 'jp.badChar', s[i]);
    }
    return steps;
  }

  function collectDescend(v, p, key, out) {
    if (out.length >= MAX_MATCHES) return;
    if (Array.isArray(v)) {
      for (let i = 0; i < v.length; i++) collectDescend(v[i], pathIdx(p, i), key, out);
    } else if (v !== null && typeof v === 'object') {
      if (Object.prototype.hasOwnProperty.call(v, key)) out.push({ value: v[key], path: pathKey(p, key) });
      const ks = Object.keys(v);
      for (let i = 0; i < ks.length; i++) collectDescend(v[ks[i]], pathKey(p, ks[i]), key, out);
    }
  }

  function collectAll(v, p, out) {
    if (out.length >= MAX_MATCHES) return;
    if (Array.isArray(v)) {
      for (let i = 0; i < v.length; i++) {
        out.push({ value: v[i], path: pathIdx(p, i) });
        collectAll(v[i], pathIdx(p, i), out);
      }
    } else if (v !== null && typeof v === 'object') {
      const ks = Object.keys(v);
      for (let i = 0; i < ks.length; i++) {
        out.push({ value: v[ks[i]], path: pathKey(p, ks[i]) });
        collectAll(v[ks[i]], pathKey(p, ks[i]), out);
      }
    }
  }

  function splitTop(e, op) {
    const parts = [];
    let depth = 0, q = null, cur = '';
    for (let i = 0; i < e.length; i++) {
      const c = e[i];
      if (q) {
        cur += c;
        if (c === '\\') { cur += e[++i] || ''; continue; }
        if (c === q) q = null;
        continue;
      }
      if (c === "'" || c === '"') { q = c; cur += c; continue; }
      if (c === '(' || c === '[') depth++;
      else if (c === ')' || c === ']') depth--;
      if (depth === 0 && c === op[0] && e[i + 1] === op[1]) { parts.push(cur); cur = ''; i++; continue; }
      cur += c;
    }
    parts.push(cur);
    return parts;
  }

  function parseLiteral(s) {
    s = s.trim();
    if (s.length >= 2 && (s[0] === "'" || s[0] === '"') && s[s.length - 1] === s[0]) {
      const inner = s.slice(1, -1);
      try { return JSON.parse('"' + inner.replace(/"/g, '\\"') + '"'); } catch (e) { return inner; }
    }
    if (s === 'true') return true;
    if (s === 'false') return false;
    if (s === 'null') return null;
    if (s !== '' && !Number.isNaN(Number(s))) return Number(s);
    return s;
  }

  const toNum = (x) => (typeof x === 'number' ? x : Number(x));

  function looseEq(a, b) {
    if (a === b) return true;
    if (a === null || b === null || a === undefined || b === undefined) return false;
    if (typeof a === 'object' || typeof b === 'object') return false;
    return String(a) === String(b);
  }

  function compare(a, op, b) {
    if (op === '=~') {
      const m = String(b).match(/^\/([\s\S]*)\/([gimsuy]*)$/);
      const re = m ? new RegExp(m[1], m[2]) : new RegExp(String(b));
      return a !== undefined && a !== null && re.test(String(a));
    }
    if (a === undefined) return op === '!=' || op === '!==';
    switch (op) {
      case '==': case '===': return looseEq(a, b);
      case '!=': case '!==': return !looseEq(a, b);
      case '<': return toNum(a) < toNum(b);
      case '<=': return toNum(a) <= toNum(b);
      case '>': return toNum(a) > toNum(b);
      case '>=': return toNum(a) >= toNum(b);
      default: return false;
    }
  }

  function resolveAt(node, expr) {
    if (expr === '@') return node;
    const r = queryJson(node, parseJsonPath('$' + expr.slice(1)));
    return r.length ? r[0].value : undefined;
  }

  function evalCond(node, raw) {
    const e = unwrap(raw);
    if (!e) throw new Error(tr('jp.emptyFilter'));
    const m = e.match(/^(@[\s\S]*?)\s*(===|==|!==|!=|<=|>=|=~|<|>)\s*([\s\S]+)$/);
    if (m) return compare(resolveAt(node, m[1].trim()), m[2], parseLiteral(m[3]));
    if (e[0] === '@') return resolveAt(node, e) !== undefined;
    throw new Error(tr('jp.filterParse', raw));
  }

  function evalFilter(node, src) {
    // 先脱掉整体包裹的括号，否则 && / || 会被包在括号内而无法在顶层拆分
    const e = unwrap(src);
    if (!e) throw new Error(tr('jp.emptyFilter'));
    return splitTop(e, '||').some((orPart) =>
      splitTop(orPart, '&&').every((cond) => {
        if (!cond.trim()) throw new Error(tr('jp.filterClause'));
        return evalCond(node, cond);
      })
    );
  }

  function applyStep(nodes, st) {
    const out = [];
    for (let ni = 0; ni < nodes.length; ni++) {
      if (out.length >= MAX_MATCHES) break;
      const v = nodes[ni].value, p = nodes[ni].path;
      const isArr = Array.isArray(v);
      const isObj = !isArr && v !== null && typeof v === 'object';
      switch (st.t) {
        case 'child':
          if (isObj && Object.prototype.hasOwnProperty.call(v, st.key)) {
            out.push({ value: v[st.key], path: pathKey(p, st.key) });
          } else if (isArr && /^-?\d+$/.test(String(st.key))) {
            const raw = Number(st.key);
            const i = raw < 0 ? v.length + raw : raw;
            if (i >= 0 && i < v.length) out.push({ value: v[i], path: pathIdx(p, i) });
          }
          break;
        case 'index': {
          if (!isArr) break;
          const i = st.idx < 0 ? v.length + st.idx : st.idx;
          if (i >= 0 && i < v.length) out.push({ value: v[i], path: pathIdx(p, i) });
          break;
        }
        case 'wild':
          if (isArr) { for (let i = 0; i < v.length; i++) out.push({ value: v[i], path: pathIdx(p, i) }); }
          else if (isObj) { const ks = Object.keys(v); for (let i = 0; i < ks.length; i++) out.push({ value: v[ks[i]], path: pathKey(p, ks[i]) }); }
          break;
        case 'descend': collectDescend(v, p, st.key, out); break;
        case 'descendWild': collectAll(v, p, out); break;
        case 'slice': {
          if (!isArr) break;
          const len = v.length, step = st.step;
          const norm = (x, dflt) => (x === undefined ? dflt : (x < 0 ? Math.max(0, len + x) : Math.min(x, len)));
          if (step > 0) {
            const from = norm(st.from, 0), to = norm(st.to, len);
            for (let i = from; i < to; i += step) out.push({ value: v[i], path: pathIdx(p, i) });
          } else {
            const from = st.from === undefined ? len - 1 : (st.from < 0 ? Math.max(-1, len + st.from) : Math.min(st.from, len - 1));
            const to = st.to === undefined ? -1 : (st.to < 0 ? len + st.to : st.to);
            for (let i = from; i > to; i += step) if (i >= 0 && i < len) out.push({ value: v[i], path: pathIdx(p, i) });
          }
          break;
        }
        case 'unionIdx':
          if (!isArr) break;
          for (let i = 0; i < st.idx.length; i++) {
            const raw = st.idx[i];
            const k = raw < 0 ? v.length + raw : raw;
            if (k >= 0 && k < v.length) out.push({ value: v[k], path: pathIdx(p, k) });
          }
          break;
        case 'unionKeys':
          if (!isObj) break;
          for (let i = 0; i < st.keys.length; i++) {
            if (Object.prototype.hasOwnProperty.call(v, st.keys[i])) out.push({ value: v[st.keys[i]], path: pathKey(p, st.keys[i]) });
          }
          break;
        case 'filter':
          if (isArr) {
            for (let i = 0; i < v.length; i++) if (evalFilter(v[i], st.src)) out.push({ value: v[i], path: pathIdx(p, i) });
          } else if (isObj) {
            const ks = Object.keys(v);
            for (let i = 0; i < ks.length; i++) if (evalFilter(v[ks[i]], st.src)) out.push({ value: v[ks[i]], path: pathKey(p, ks[i]) });
          }
          break;
      }
    }
    return out;
  }

  function queryJson(root, steps) {
    let cur = [{ value: root, path: '$' }];
    for (let i = 0; i < steps.length; i++) {
      cur = applyStep(cur, steps[i]);
      if (!cur.length) break;
    }
    return cur;
  }

  /* ---------- JSONPath 字段自动提示 ---------- */

  let acItems = [], acIndex = -1, acCtx = null, acSuppress = false;

  function closeAutocomplete() {
    jpSuggest.hidden = true;
    jpOptions.textContent = '';
    acItems = [];
    acIndex = -1;
    acCtx = null;
    qInput.setAttribute('aria-expanded', 'false');
    qInput.removeAttribute('aria-activedescendant');
  }

  // 找光标前最后一个不在 [] / 引号中的单点；递归运算符 .. 不参与字段补全
  function autocompleteContext(text, caret) {
    const before = text.slice(0, caret);
    let quote = null, depth = 0, lastDot = -1;
    for (let i = 0; i < before.length; i++) {
      const c = before[i];
      if (quote) {
        if (c === '\\') { i++; continue; }
        if (c === quote) quote = null;
        continue;
      }
      if (c === '"' || c === "'") { quote = c; continue; }
      if (c === '[') { depth++; continue; }
      if (c === ']') { depth = Math.max(0, depth - 1); continue; }
      if (c === '.' && depth === 0) lastDot = i;
    }
    if (lastDot < 0 || before[lastDot - 1] === '.' || before[lastDot + 1] === '.') return null;
    const filter = before.slice(lastDot + 1);
    if (!/^[A-Za-z0-9_$\-\u0080-\uffff]*$/.test(filter)) return null;
    const parent = before.slice(0, lastDot) || '$';
    return { parent: parent, filter: filter, dot: lastDot, start: lastDot + 1, end: caret };
  }

  function valuePreview(v) {
    if (Array.isArray(v)) return '[' + v.length + ']';
    if (v !== null && typeof v === 'object') return '{' + Object.keys(v).length + '}';
    const s = JSON.stringify(v);
    if (s === undefined) return String(v);
    return s.length > 32 ? s.slice(0, 29) + '…' : s;
  }

  function buildSuggestions(ctx) {
    let root;
    try { root = JSON.parse(editor.getText()); } catch (e) { return []; }
    let nodes;
    try { nodes = queryJson(root, parseJsonPath(ctx.parent)); } catch (e) { return []; }
    if (!nodes.length) return [];

    const map = new Map();
    let arrayMode = true, foundContainer = false;
    for (const node of nodes) {
      const v = node.value;
      if (Array.isArray(v)) {
        foundContainer = true;
        for (const item of v) {

    let keys = [...map.keys()].filter((k) => k.toLocaleLowerCase().startsWith(needle));

      if (arrayMode) {

  function hlXmlTag(tag) {

    i = j;
    while (i < tag.length) {
      const c = tag[i];
      if (c === '>' || c === '/' || c === '?') { out.push('<span class="p">', c, '</span>'); i++; continue; }
      if (/\s/.test(c)) { out.push(fastEsc(c)); i++; continue; }

      while (k < tag.length && !/[\s=/>]/.test(tag[k])) k++;

  function hlXml(src) {

        let end;
        if (src.startsWith('<!--', i)) { const j = src.indexOf('-->', i); end = j < 0 ? n : j + 3; }

        i = end; continue;
      }
      if (src[i] === '<') {

  /* ---------- 命名与类型推断 ---------- */

  const RESERVED = {
    java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws transient try void volatile while null true false record var'.split(' '),
    python: 'and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield None True False'.split(' '),
    go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false iota'.split(' '),
    typescript: 'any as async await boolean break case catch class const constructor continue declare default delete do else enum export extends false finally for from function get if implements import in infer instanceof interface keyof let module namespace new null number object package private protected public readonly return set static string super switch symbol this throw true try type typeof undefined var void while yield'.split(' ')

  function splitWords(s) {

  function camelCase(s) {

  function snakeCase(s) {

  function analyze(v, name) {

    if (NUM_RANK[a.kind] && NUM_RANK[b.kind]) {

    if (a.kind !== b.kind) return { kind: 'any' };
    const nullable = a.nullable || b.nullable;

      for (let i = 0; i < ks.length; i++) emitXml(v[ks[i]], xmlName(ks[i]), depth + 1, out);

      for (let i = 0; i < v.length; i++) {

        lines.push(pad + '- ' + (r.head ? r.head : r.lines[0].slice(strip)));

  /* ---------- 转换为 Java POJO ---------- */

  function javaType(t) {

    t.fields.forEach((f) => {
      const name = ident(f.key, 'java', 'camel');
      if (name !== f.key) out.push(inner + '@JsonProperty("' + f.key.replace(/"/g, '\\"') + '")');
      out.push(inner + 'private ' + javaType(f.type) + ' ' + name + ';');
      const nt = f.type.kind === 'object' ? f.type : (f.type.kind === 'array' && f.type.item.kind === 'object' ? f.type.item : null);
      if (nt) nested.push(nt);
    });
    out.push('');
    t.fields.forEach((f) => {
      const name = ident(f.key, 'java', 'camel');
      const ty = javaType(f.type);
      const cap = name.charAt(0).toUpperCase() + name.slice(1);
      out.push(inner + 'public ' + ty + ' get' + cap + '() { return ' + name + '; }');
      out.push(inner + 'public void set' + cap + '(' + ty + ' ' + name + ') { this.' + name + ' = ' + name + '; }');
      out.push('');
    });
    const seen = new Set();
    nested.forEach((nt) => {
      if (seen.has(nt.resolvedName)) return;
      seen.add(nt.resolvedName);
      emitJava(nt, depth + 1, out, false);
      out.push('');
    });
    out.push(pad + '}');
  }

  function convertJava(root) {
    const s = buildSchema(root);
    const out = ['import java.util.List;'];
    if (javaNeedsAnnotation(s.schema)) out.push('import com.fasterxml.jackson.annotation.JsonProperty;');
    out.push('');
    if (s.wrapped) out.push('// ' + tr('gen.wrapped'));
    emitJava(s.schema, 0, out, true);
    return out.join('\n') + '\n';
  }

  /* ---------- 转换为 Python dataclass ---------- */

  function pyType(t) {
    const base = (() => {
      switch (t.kind) {
        case 'string': return 'str';
        case 'bool': return 'bool';
        case 'int': return 'int';
        case 'long': return 'int';
        case 'double': return 'float';
        case 'array': return 'List[' + pyType(t.item) + ']';
        case 'object': return t.resolvedName || 'Any';
        default: return 'Any';
      }
    })();
    return t.nullable ? 'Optional[' + base + ']' : base;
  }

  function emitPython(t, out) {
    out.push('@dataclass');
    out.push('class ' + t.resolvedName + ':');
    // dataclass 要求带默认值的字段排在后面
    const required = t.fields.filter((f) => !f.optional && !f.type.nullable);
    const optional = t.fields.filter((f) => f.optional || f.type.nullable);
    const all = required.concat(optional);
    if (!all.length) { out.push('    pass'); out.push(''); return; }
    all.forEach((f) => {
      const name = ident(f.key, 'python', 'snake');
      let ty = pyType(f.type);
      if (f.optional && ty.indexOf('Optional[') !== 0) ty = 'Optional[' + ty + ']';
      let line = '    ' + name + ': ' + ty;
      if (f.optional) {
        line += f.type.kind === 'array' ? ' = field(default_factory=list)' : ' = None';
      }
      if (name !== f.key) line += '  # json: ' + JSON.stringify(f.key);
      out.push(line);
    });
    out.push('');
  }

  function collectPythonTypes(t, list, seen) {
    if (!t || typeof t !== 'object') return;
    if (t.kind === 'object') {
      if (!seen.has(t.resolvedName)) { seen.add(t.resolvedName); t.fields.forEach((f) => collectPythonTypes(f.type, list, seen)); list.push(t); }
      return;
    }
    if (t.kind === 'array') collectPythonTypes(t.item, list, seen);
  }

  function convertPython(root) {
    const s = buildSchema(root);
    const list = [];
    collectPythonTypes(s.schema, list, new Set());
    const out = ['from __future__ import annotations', '', 'from dataclasses import dataclass, field', 'from typing import Any, Dict, List, Optional', ''];
    if (s.wrapped) out.push('# ' + tr('gen.wrapped'));
    list.forEach((t) => emitPython(t, out));
    return out.join('\n').replace(/\n{3,}$/, '\n');
  }

  /* ---------- 转换为 Go struct ---------- */

  function goType(t) {
    switch (t.kind) {
      case 'string': return 'string';
      case 'bool': return 'bool';
      case 'int': return 'int64';
      case 'long': return 'int64';
      case 'double': return 'float64';
      case 'array': return '[]' + goType(t.item);
      case 'object': return '*' + (t.resolvedName || 'struct{}');
      default: return 'interface{}';
    }
  }

  function collectGoTypes(t, list, seen) {
    if (!t || typeof t !== 'object') return;
    if (t.kind === 'object') {
      if (!seen.has(t.resolvedName)) { seen.add(t.resolvedName); t.fields.forEach((f) => collectGoTypes(f.type, list, seen)); list.push(t); }
      return;
    }
    if (t.kind === 'array') collectGoTypes(t.item, list, seen);
  }

  function convertGo(root) {
    const s = buildSchema(root);
    const list = [];
    collectGoTypes(s.schema, list, new Set());
    const out = ['package main', ''];
    if (s.wrapped) out.push('// ' + tr('gen.wrappedGo'));
    list.forEach((t, i) => {
      if (i) out.push('');
      out.push('type ' + t.resolvedName + ' struct {');
      if (!t.fields.length) out.push('\t// ' + tr('gen.empty'));
      t.fields.forEach((f) => {
        const name = ident(f.key, 'go', 'pascal');
        // 对象类型本身已是指针、切片本身可为 nil，其余可空字段才加 *
        const scalar = f.type.kind !== 'object' && f.type.kind !== 'array';
        const ty = (f.optional || f.type.nullable) && scalar ? '*' + goType(f.type) : goType(f.type);
        const tag = f.optional ? f.key + ',omitempty' : f.key;
        out.push('\t' + name + ' ' + ty + ' `json:"' + tag.replace(/"/g, '\\"') + '"`');
      });
      out.push('}');
    });
    return out.join('\n') + '\n';
  }

  /* ---------- 转换为 TypeScript interface ---------- */

  function tsType(t) {
    switch (t.kind) {
      case 'string': return 'string';
      case 'bool': return 'boolean';
      case 'int': case 'long': case 'double': return 'number';
      case 'array': {
        const it = tsType(t.item);
        return /[|&]/.test(it) || it.indexOf(' ') >= 0 ? '(' + it + ')[]' : it + '[]';
      }
      case 'object': return t.resolvedName || 'Record<string, unknown>';
      case 'null': return 'null';
      default: return 'unknown';
    }
  }

  function collectTsTypes(t, list, seen) {
    if (!t || typeof t !== 'object') return;
    if (t.kind === 'object') {
      if (!seen.has(t.resolvedName)) { seen.add(t.resolvedName); t.fields.forEach((f) => collectTsTypes(f.type, list, seen)); list.push(t); }
      return;
    }
    if (t.kind === 'array') collectTsTypes(t.item, list, seen);
  }

  function tsKey(k) {
    return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
  }

  function convertTypeScript(root) {
    const s = buildSchema(root);
    const list = [];
    collectTsTypes(s.schema, list, new Set());
    const out = [];
    if (s.wrapped) out.push('// ' + tr('gen.wrapped'));
    list.forEach((t, i) => {
      if (i) out.push('');
      out.push('export interface ' + t.resolvedName + ' {');
      if (!t.fields.length) out.push('  // ' + tr('gen.empty'));
      t.fields.forEach((f) => {
        let ty = tsType(f.type);
        if (f.type.nullable) ty += ' | null';
        out.push('  ' + tsKey(f.key) + (f.optional ? '?' : '') + ': ' + ty + ';');
      });
      out.push('}');
    });
    return out.join('\n') + '\n';
  }

  /* ---------- 结果区 ---------- */

  const FORMATS = {
    xml: { label: 'XML', fn: convertXml },
    yaml: { label: 'YAML', fn: convertYaml },
    java: { label: 'Java POJO', fn: convertJava },
    python: { label: 'Python dataclass', fn: convertPython },
    go: { label: 'Go struct', fn: convertGo },
    typescript: { label: 'TypeScript interface', fn: convertTypeScript }
  };

  const HIGHLIGHTERS = {
    json: highlight,
    xml: hlXml,
    yaml: hlYaml,
    java: (s) => hlCode(s, 'java'),
    python: (s) => hlCode(s, 'python'),
    go: (s) => hlCode(s, 'go'),
    typescript: (s) => hlCode(s, 'typescript')
  };

  const qSummary = $('qSummary');
  let lastAction = null;
  // 结果按行拆成 div 后 textContent 不再含换行，复制必须用原始文本
  let lastResultText = '';
  // 最近一次查询命中的节点；仅当它是一维标量列表时才提供 SQL IN 复制
  let lastMatches = null;
  // 右侧 JSON 折叠区域与状态（行号从 0 开始）
  let foldRegions = [], foldedLines = new Set();

  const copySplit = $('copySplit'), btnCopyMenu = $('btnCopyMenu'), copyMenu = $('copyMenu');
  const foldActions = $('foldActions');
  const leftMenus = [...document.querySelectorAll('#jsonPane .copy-split')].map((split) => ({
    btn: split.querySelector('.caret'),
    menu: split.querySelector('.copy-menu')
  }));

  const isScalarList = (ms) => Array.isArray(ms) && ms.length > 0
    && ms.every((m) => typeof m.value === 'string' || (typeof m.value === 'number' && Number.isFinite(m.value)));

  // SQL 标准转义：单引号翻倍。数字不加引号，字符串加单引号
  function toSqlIn(ms) {
    return '(' + ms.map((m) => (typeof m.value === 'number'
      ? String(m.value)
      : "'" + String(m.value).replace(/'/g, "''") + "'")).join(', ') + ')';
  }

  function closeCopyMenu() {
    copyMenu.hidden = true;
    btnCopyMenu.setAttribute('aria-expanded', 'false');
  }

  function closeLeftMenus(except) {
    leftMenus.forEach((entry) => {
      if (entry === except) return;
      entry.menu.hidden = true;
      entry.btn.setAttribute('aria-expanded', 'false');
    });
  }

  function positionLeftMenus() {
    leftMenus.forEach(({ btn, menu }) => {
      if (menu.hidden) return;
      const buttonRect = btn.getBoundingClientRect();
      const toolbarRect = btn.closest('.toolbar').getBoundingClientRect();
      const menuRect = menu.getBoundingClientRect();
      const margin = 6;
      const left = Math.max(margin, Math.min(buttonRect.right - menuRect.width, window.innerWidth - menuRect.width - margin));
      menu.style.left = left + 'px';
      menu.style.top = (toolbarRect.bottom + 5) + 'px';
    });
  }

  function updateCopySplit() {
    const on = isScalarList(lastMatches);
    copySplit.classList.toggle('split', on);
    if (!on) { closeCopyMenu(); return; }
    const sql = toSqlIn(lastMatches);
    $('sqlPreview').textContent = sql.length > 46 ? sql.slice(0, 46) + '…' : sql;
    $('miCopySql').title = sql.length > 200 ? sql.slice(0, 200) + '…' : sql;
  }

  function scanFoldRegions(text) {
    const stack = [], regions = [];
    let line = 0, quote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quote) {
        if (c === '\\') { i++; continue; }
        if (c === '"') quote = false;
        if (c === '\n') line++;
        continue;
      }
      if (c === '"') { quote = true; continue; }
      if (c === '\n') { line++; continue; }
      if (c === '{' || c === '[') { stack.push({ char: c, line: line }); continue; }
      if (c === '}' || c === ']') {
        const open = stack.pop();
        if (!open || (open.char === '{' && c !== '}') || (open.char === '[' && c !== ']')) continue;
        if (line > open.line) regions.push({ start: open.line, end: line, char: open.char });
      }
    }
    // 同一行若出现多个可折叠区域，优先折叠跨度最大的外层
    regions.sort((a, b) => a.start - b.start || b.end - a.end);
    const seen = new Set();
    const unique = regions.filter((r) => { if (seen.has(r.start)) return false; seen.add(r.start); return true; });
    return unique.length <= MAX_FOLD_REGIONS ? unique : [];
  }

  function applyFolds(container = qResult, regions = foldRegions, collapsed = foldedLines) {
    const lines = container.querySelectorAll('.ln');
    lines.forEach((line) => {
      line.classList.remove('fold-hidden', 'folded');
      const btn = line.querySelector('.fold-toggle');
      if (btn) {
        btn.textContent = '▾';
        btn.title = tr('btn.collapseAll');
        btn.setAttribute('aria-label', tr('btn.collapseAll'));
      }
    });
    for (const region of regions) {
      if (!collapsed.has(region.start)) continue;
      const start = lines[region.start];
      if (!start) continue;
      start.classList.add('folded');
      const btn = start.querySelector('.fold-toggle');
      if (btn) {
        btn.textContent = '▸';
        btn.title = tr('btn.expandAll');
        btn.setAttribute('aria-label', tr('btn.expandAll'));
      }
      for (let i = region.start + 1; i <= region.end && i < lines.length; i++) lines[i].classList.add('fold-hidden');
    }
  }

  function renderFoldControls(text) {
    foldRegions = scanFoldRegions(text);
    foldedLines = new Set();
    foldActions.hidden = foldRegions.length === 0;
    if (!foldRegions.length) return;
    decorateFoldControls(qResult, foldRegions, (line) => {
      if (foldedLines.has(line)) foldedLines.delete(line);
      else foldedLines.add(line);
      applyFolds();
    });
  }

  function resetFolds() {
    foldRegions = [];
    foldedLines = new Set();
    foldActions.hidden = true;
  }

  function showIdle() {
    resetFolds();
    qResult.className = 'empty no-gutter';
    qResult.textContent = tr('result.hint');
    qSummary.textContent = '';
    qSummary.className = '';
    lastResultText = '';
    lastMatches = null;
    updateCopySplit();
  }

  function showResult(text, opts) {
    const o = opts || {};
    qSummary.innerHTML = o.summary || '';
    qSummary.className = o.kind || '';
    lastResultText = text || '';
    lastMatches = o.matches || null;
    updateCopySplit();
    resetFolds();
    if (!text) { qResult.className = 'no-gutter'; qResult.textContent = ''; return; }
    // 只有正常的格式化结果才编号；错误提示、无匹配提示与超大文本走纯文本
    const hl = o.fmt && o.kind !== 'err' && text.length <= MAX_HL_CHARS ? HIGHLIGHTERS[o.fmt] : null;
    if (hl) {
      qResult.className = '';
      qResult.innerHTML = toLineDivs(hl(text));
      if (o.fmt === 'json') renderFoldControls(text);
    } else {
      qResult.className = (o.kind === 'err' ? 'err ' : '') + 'no-gutter';
      qResult.textContent = text;
    }
  }

  // 只输出查询到的值本身；路径与匹配数在底部摘要里，不再混进结果
  function formatMatchesBody(matches) {
    const one = (v) => (isScalar(v) ? JSON.stringify(v) : JSON.stringify(v, null, 2));
    if (matches.every((m) => isScalar(m.value))) return matches.map((m) => one(m.value)).join('\n');
    return matches.map((m) => one(m.value)).join('\n\n');
  }

  function runQuery(report) {
    const expr = qInput.value.trim();
    if (!expr) { lastAction = null; showIdle(); return; }
    lastAction = { kind: 'query' };

    const src = editor.getText();
    if (!src.trim()) { showResult(tr('res.noContent'), { kind: 'err', summary: tr('sum.qFail') }); return; }

    let root;
    try { root = JSON.parse(src); }
    catch (e) { showResult(tr('res.badJsonQ', parseError(src, e).message), { kind: 'err', summary: tr('sum.badJson') }); return; }

    let steps;
    try { steps = parseJsonPath(expr); }
    catch (e) { showResult(tr('res.jpSyntax', e.message), { kind: 'err', summary: tr('sum.jpSyntax') }); return; }

    let matches;
    try { matches = queryJson(root, steps); }
    catch (e) { showResult(tr('res.jpExec', e.message), { kind: 'err', summary: tr('sum.jpExec') }); return; }

    const shown = escHtml(expr);
    if (!matches.length) {
      showResult(tr('res.noMatch'), { summary: tr('sum.matched', 0, shown) });
      if (report) showToast(tr('toast.noMatch'));
      return;
    }
    const truncated = matches.length >= MAX_MATCHES;
    showResult(formatMatchesBody(matches), {
      fmt: 'json',
      matches: matches,
      summary: tr('sum.matched', matches.length, shown) + (truncated ? tr('sum.trunc', MAX_MATCHES) : '')
    });
    if (report) showToast(tr('toast.matched', matches.length));
  }

  function runConvert(report) {
    const fmt = $('selFormat').value;
    const spec = FORMATS[fmt];
    lastAction = { kind: 'convert', fmt: fmt };

    const src = editor.getText();
    if (!src.trim()) { showResult(tr('res.noContentC'), { kind: 'err', summary: tr('sum.convFail', spec.label) }); return; }

    let root;
    try { root = JSON.parse(src); }
    catch (e) { showResult(tr('res.badJsonC', parseError(src, e).message), { kind: 'err', summary: tr('sum.badJson') }); return; }

    let text;
    try { text = spec.fn(root); }
    catch (e) { showResult(tr('res.convFail', e.message), { kind: 'err', summary: tr('sum.convFail', spec.label) }); return; }

    showResult(text, {
      fmt: fmt,
      summary: tr('sum.converted', spec.label, fmtBytes(byteLen(text)), countLines(text))
    });
    if (report) showToast(tr('toast.converted', spec.label));
  }

  // 左侧内容变化后，重跑上一次执行过的操作
  function refreshResult(report) {
    if (!lastAction) { if (!qInput.value.trim()) showIdle(); return; }
    if (lastAction.kind === 'query') runQuery(report);
    else runConvert(report);
  }

  /* ---------- 编辑器历史与内容写入 ---------- */

  function updateEditorControls() {
    $('btnUndo').disabled = editor.undoDepth() === 0;
    $('btnRedo').disabled = editor.redoDepth() === 0;
    $('btnLeftExpandAll').disabled = !editor.hasFolds();
    $('btnLeftCollapseAll').disabled = !editor.hasContent();
  }

  const undo = () => { if (editor.undo()) showToast(tr('toast.undo')); };
  const redo = () => { if (editor.redo()) showToast(tr('toast.redo')); };

  function writeResult(text, message, kind, known) {
    editor.replaceDocument(text);
    if (known) {
      setEditorValidity('ok');
      setBadge(tr('badge.ok'), 'ok');
      updateStats(known.value);
    } else {
      validate();
    }
    refreshResult(false);
    if (message !== undefined) setMsg(message, kind);
  }

  /* ---------- 各项处理 ---------- */

  function getIndent() {
    const v = $('selIndent').value;
    if (v === 'tab') return '\t';
    const n = +v;
    return n === 0 ? 0 : n;
  }

  function sortDeep(v) {
    if (Array.isArray(v)) return v.map(sortDeep);
    if (v && typeof v === 'object') {
      const o = {};
      Object.keys(v).sort().forEach((k) => { o[k] = sortDeep(v[k]); });
      return o;
    }
    return v;
  }

  function stringify(v) {
    const data = $('chkSort').checked ? sortDeep(v) : v;
    const indent = getIndent();
    return indent === 0 ? JSON.stringify(data) : JSON.stringify(data, null, indent);
  }

  function needValue() {
    const v = validate();
    if (v === undefined) { setMsg(tr('msg.empty'), 'note'); showToast(tr('toast.empty')); return null; }
    if (v && v.__error) {
      const info = v.__error;
      setMsg(escHtml(tr('msg.parseFail', info.line, info.col, info.message)) +
        ' &nbsp;<a id="jumpErr2">' + tr('link.locate') + '</a>', 'error');
      const a = $('jumpErr2');
      if (a) a.onclick = () => selectPos(info.pos);
      selectPos(info.pos);
      showToast(tr('toast.parseFail'));
      return null;
    }
    return v;
  }

  function doFormat() {
    const v = needValue();
    if (v === null) return;
    writeResult(stringify(v), $('chkSort').checked ? tr('msg.sorted') : tr('msg.formatted'), '', { value: v });
    showToast(tr('toast.formatted'));
  }

  // 字符串感知的压缩：即使 JSON 不完全合法也能去掉多余空白
  function stripWhitespace(text) {
    const parts = [];
    let inStr = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inStr) {
        parts.push(c);
        if (c === '\\') { if (i + 1 < text.length) parts.push(text[++i]); continue; }
        if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { inStr = true; parts.push(c); continue; }
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') continue;
      parts.push(c);
    }
    return parts.join('');
  }

  function doMinify() {
    const text = editor.getText();
    validate();
    if (!text.trim()) { setMsg(tr('msg.empty'), 'note'); showToast(tr('toast.empty')); return; }
    let v = null;
    try { v = JSON.parse(text); } catch (e) { /* 走容错压缩 */ }
    if (v !== null) {
      const data = $('chkSort').checked ? sortDeep(v) : v;
      const out = JSON.stringify(data);
      writeResult(out, tr('msg.minified', fmtBytes(byteLen(text)), fmtBytes(byteLen(out))), '', { value: data });
    } else {
      writeResult(stripWhitespace(text), tr('msg.minTolerant'), 'note');
    }
    showToast(tr('toast.minified'));
  }

  function escapeToString(text) {
    let r = JSON.stringify(text).slice(1, -1);
    if ($('chkAscii').checked) {
      r = r.replace(/[\u0080-\uffff]/g, (ch) => '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0'));
    }
    return r;
  }

  function doEscape() {
    const text = editor.getText();
    if (!text) { setMsg(tr('msg.empty'), 'note'); showToast(tr('toast.empty')); return; }
    writeResult(escapeToString(text), $('chkAscii').checked ? tr('msg.escapedAscii') : tr('msg.escaped'), '');
    showToast(tr('toast.escaped'));
  }

  function doMinifyEscape() {
    const text = editor.getText();
    if (!text.trim()) { setMsg(tr('msg.empty'), 'note'); showToast(tr('toast.empty')); return; }
    let v = null;
    try { v = JSON.parse(text); } catch (e) { /* 走容错压缩 */ }
    const minified = v !== null ? JSON.stringify($('chkSort').checked ? sortDeep(v) : v) : stripWhitespace(text);
    const r = escapeToString(minified);
    writeResult(r, v !== null
      ? tr('msg.minEscaped', fmtBytes(byteLen(text)), fmtBytes(byteLen(r)))
      : tr('msg.minEscTolerant'), v !== null ? '' : 'note');
    showToast(tr('toast.minEscaped'));
  }

  function manualUnescape(s) {
    return s.replace(/\\(u[0-9a-fA-F]{4}|x[0-9a-fA-F]{2}|[\s\S])/g, (m, g) => {
      const h = g[0];
      if (h === 'u' || h === 'x') return String.fromCharCode(parseInt(g.slice(1), 16));
      switch (g) {
        case 'n': return '\n'; case 't': return '\t'; case 'r': return '\r';
        case 'b': return '\b'; case 'f': return '\f'; case 'v': return '\v';
        case '0': return '\0';
        default: return g;
      }
    });
  }

  function unescapeText(raw) {
    const t = raw.trim();
    if (!t) return '';
    const quoted = t.length >= 2 && t[0] === '"' && t[t.length - 1] === '"';
    const inner = quoted ? t.slice(1, -1) : t;
    const prep = inner.replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
    try { return JSON.parse('"' + prep + '"'); } catch (e) { /* 不是合法的字符串字面量 */ }
    // 形如 JSON 却无法按字符串字面量解析时，手工替换会把 \n 变成真实换行、进一步破坏结构，因此原样返回
    if (t[0] === '{' || t[0] === '[') return raw;
    return manualUnescape(inner);
  }

  function doUnescape() {
    const text = editor.getText();
    if (!text.trim()) { setMsg(tr('msg.empty'), 'note'); showToast(tr('toast.empty')); return; }

    let parsed, isJson = false;
    try { parsed = JSON.parse(text); isJson = true; } catch (e) { /* 非合法 JSON，继续尝试去转义 */ }

    // 已经是 JSON 对象/数组/数字等：其中的 \n、\" 属于 JSON 自身的转义，再脱一层就会产生非法控制字符
    if (isJson && typeof parsed !== 'string') {
      setMsg(tr('msg.unescSkip'), 'note');
      showToast(tr('toast.noop'));
      return;
    }

    const r = unescapeText(text);
    if (r === text) { setMsg(tr('msg.unescNone'), 'note'); showToast(tr('toast.noop')); return; }
    let note;
    try { JSON.parse(r); note = tr('msg.unescJson'); } catch (e) { note = tr('msg.unescText'); }
    writeResult(r, note, '');
    showToast(tr('toast.unescaped'));
  }

  function doSmart() {
    const original = editor.getText();
    if (!original.trim()) { setMsg(tr('msg.empty'), 'note'); showToast(tr('toast.empty')); return; }
    syncStats();

    let text = original;
    const steps = [];
    let v = null;
    for (let round = 0; round < 4; round++) {
      try { v = JSON.parse(text); break; } catch (e) { /* 继续尝试去转义 */ }
      const un = unescapeText(text);
      if (un === text) break;
      text = un;
      steps.push(tr('step.unesc'));
    }
    if (v === null) {
      try { v = JSON.parse(text); } catch (e) {
        const info = parseError(original, e);
        setEditorValidity('err');
        setBadge(tr('badge.err'), 'err');
        setMsg(escHtml(tr('msg.smartFail', steps.length ? tr('msg.smartTried', steps.length) : '',
          info.line, info.col, info.message)) +
          ' &nbsp;<a id="jumpErr3">' + tr('link.locate') + '</a>', 'error');
        const a = $('jumpErr3');
        if (a) a.onclick = () => selectPos(info.pos);
        selectPos(info.pos);
        showToast(tr('toast.fail'));
        return;
      }
    }
    if (typeof v === 'string') {
      // 解析结果是字符串，说明外层还包着一层，继续深入
      let inner = v, guard = 0;
      while (typeof inner === 'string' && guard++ < 4) {
        try { inner = JSON.parse(inner); steps.push(tr('step.unwrap')); } catch (e) { break; }
      }
      if (typeof inner !== 'string') v = inner;
    }

    writeResult(stringify(v), tr('msg.smart', steps.length ? tr('smart.steps', steps.join(' → ')) : tr('smart.direct')), '', { value: v });
    if (steps.length) setBadge(tr('badge.unesc'), 'warn');
    showToast(tr('toast.smart'));
  }

  // 派生输出（复制压缩、导出 CSV）始终从 JSON 根值重新生成：即使当前文本已经压缩、
  // 跳脱或多层跳脱，也不会重复压缩/再套一层跳脱
  function canonicalJsonValue() {
    let text = editor.getText().trim();
    if (!text) return null;
    let value, parsed = false;
    for (let round = 0; round < 6; round++) {
      try { value = JSON.parse(text); parsed = true; break; }
      catch (e) {
        const un = unescapeText(text);
        if (un === text) break;
        text = un;
      }
    }
    if (!parsed) return null;

    // 根节点是 JSON 字符串时继续解包；普通字符串解析失败后仍保留为字符串值
    for (let guard = 0; typeof value === 'string' && guard < 6; guard++) {
      try { value = JSON.parse(value); } catch (e) { break; }
    }
    return { value };
  }

  function canonicalJsonForCopy() {
    const parsed = canonicalJsonValue();
    if (!parsed) return null;
    return JSON.stringify($('chkSort').checked ? sortDeep(parsed.value) : parsed.value);
  }

  const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const isRecord = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  function csvCell(v) {
    let s = v === null || v === undefined ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
    // 防 CSV 注入：Excel 会把 = + - @ 开头的文本当公式执行
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // 对象数组 → 键并集作列；二维数组 → 原样成行；其余值放进 value 列；嵌套值写成 JSON 文本
  function jsonToCsv(value) {
    const items = Array.isArray(value) ? value : [value];
    if (!items.length) return null;
    let header = null, rows;
    if (items.every(Array.isArray)) {
      rows = items;
    } else {
      const keys = new Set();
      items.forEach((it) => { if (isRecord(it)) Object.keys(it).forEach((k) => keys.add(k)); });
      header = [...keys];
      let valueKey = null;
      if (items.some((it) => !isRecord(it))) {
        valueKey = 'value';
        for (let n = 2; keys.has(valueKey); n++) valueKey = 'value_' + n;
        header.push(valueKey);
      }
      if (!header.length) return null;
      rows = items.map((it) => header.map((k) => (isRecord(it)
        ? (k !== valueKey && hasOwn(it, k) ? it[k] : undefined)
        : (k === valueKey ? it : undefined))));
    }
    const lines = (header ? [header] : []).concat(rows).map((r) => r.map(csvCell).join(','));
    return { text: lines.join('\r\n') + '\r\n', rows: rows.length };
  }

  function doDownloadCsv() {
    if (!editor.getText().trim()) { showToast(tr('toast.noDl')); return; }
    const parsed = canonicalJsonValue();

    const csv = jsonToCsv(parsed.value);
    if (!csv) { showToast(tr('toast.csvNoRows')); return; }
    // BOM 让 Excel 按 UTF-8 识别中文
    saveFile('\ufeff' + csv.text, 'csv', 'text/csv;charset=utf-8');
    showToast(tr('toast.csvDl', csv.rows));
  }

    if (!file) return;

    const fr = new FileReader();

  // 只看首行（引号外）出现最多的分隔符，兼容欧洲版 Excel 的分号和 TSV
  function detectCsvDelimiter(text) {
    const counts = { ',': 0, ';': 0, '\t': 0 };
    let quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') quoted = !quoted;
      else if (!quoted && (ch === '\n' || ch === '\r')) break;
      else if (!quoted && hasOwn(counts, ch)) counts[ch]++;
    }
    return Object.keys(counts).reduce((best, d) => (counts[d] > counts[best] ? d : best), ',');
  }

  // RFC 4180：引号内可含分隔符与换行，"" 表示一个引号；引号未闭合返回 null
  function parseCsvRows(text) {
    const delimiter = detectCsvDelimiter(text);
    const rows = [];
    let row = [], field = '', quoted = false, fieldStart = true;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch !== '"') field += ch;
        else if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else if (ch === '"' && fieldStart) {
        quoted = true;
        fieldStart = false;
      } else if (ch === delimiter) {
        row.push(field);
        field = '';
        fieldStart = true;
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        fieldStart = true;
      } else {
        field += ch;
        fieldStart = false;
      }
    }
    if (quoted) return null;
    if (!fieldStart || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.length > 1 || r[0] !== '');
  }

  // 首行作表头：空列名补 columnN，重名追加 _2；值一律保留为字符串，避免 00123 之类被改写
  function csvRowsToRecords(rows) {
    const width = rows.reduce((max, r) => Math.max(max, r.length), 0);
    const used = new Set(), keys = [];
    for (let i = 0; i < width; i++) {
      const base = (rows[0][i] || '').trim() || 'column' + (i + 1);
      let key = base;
      for (let n = 2; used.has(key); n++) key = base + '_' + n;
      used.add(key);
      keys.push(key);
    }
    const records = rows.slice(1).map((r) => Object.fromEntries(keys.map((k, i) => [k, r[i] === undefined ? '' : r[i]])));
    return { records, columns: keys.length };
  }

  async function loadCsvFile(file) {
    if (!file) return;
    if (file.size > 30 * 1024 * 1024) { showToast(tr('toast.tooBig')); return; }
    let text;
    try {
      const bytes = await file.arrayBuffer();
      // 中文版 Excel 默认导出 GBK，UTF-8 解码失败时回退到 GB18030
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
      catch (e) { text = new TextDecoder('gb18030').decode(bytes); }
    } catch (e) { showToast(tr('toast.readFail')); return; }

    const rows = parseCsvRows(text);
    if (!rows) { setMsg(tr('toast.csvBad'), 'error'); showToast(tr('toast.csvBad')); return; }
    if (!rows.length) { showToast(tr('toast.csvEmpty')); return; }
    const { records, columns } = csvRowsToRecords(rows);
    loadText(stringify(records), tr('toast.csvLoaded', file.name, records.length));
    setMsg(tr('msg.csvLoaded', records.length, columns), '');
  }
