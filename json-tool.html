  qInput.addEventListener('keydown', (e) => {
    if (!jpSuggest.hidden) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setAutocompleteIndex(acIndex + 1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); setAutocompleteIndex(acIndex - 1); return; }
      if (e.key === 'Tab') {
        e.preventDefault();
        setAutocompleteIndex(acIndex + (e.shiftKey ? -1 : 1));
        return;
      }
      if (e.key === 'Enter') { e.preventDefault(); chooseAutocomplete(acIndex); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeAutocomplete(); return; }
    }
    if (e.key === 'Enter') { e.preventDefault(); runQuery(true); }
  });
  qInput.addEventListener('click', updateAutocomplete);
  document.addEventListener('click', (e) => {
    if (jpSuggest.hidden || e.target.closest('.jp-input-wrap')) return;
    closeAutocomplete();
  });

  let validationTimer = null, queryTimer = null;
  function handleEditorChange() {
    clearTimeout(validationTimer);
    validationTimer = setTimeout(validate, 90);
    clearTimeout(queryTimer);
    queryTimer = setTimeout(() => refreshResult(false), 260);
    if (!jpSuggest.hidden || document.activeElement === qInput) updateAutocomplete();
  }

  let qDebounce = null;
  qInput.addEventListener('input', () => {
    clearTimeout(qDebounce);
    const opened = updateAutocomplete();
    // 输入未完成且有候选时，不用语法错误刷掉右侧原结果；选中候选后会继续自动查询
    if (!opened) qDebounce = setTimeout(() => runQuery(false), 220);
  });

  $('selIndent').addEventListener('change', () => {
    editor.setIndent($('selIndent').value === 'tab' ? '\t' : ' '.repeat(Number($('selIndent').value) || 2));
  });

  document.addEventListener('keydown', (e) => {
    if (!(e.metaKey || e.ctrlKey)) return;
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'y') {
      if (e.target === qInput) return;
      e.preventDefault();
      e.stopPropagation();
      if (k === 'y' || e.shiftKey) redo(); else undo();
      return;
    }
    if (k === 'e' && e.shiftKey) { e.preventDefault(); e.stopPropagation(); doMinifyEscape(); return; }
    const map = { enter: doFormat, m: doMinify, e: doEscape, u: doUnescape, j: doSmart, s: doDownload, t: () => runConvert(true) };
    if (map[k]) { e.preventDefault(); e.stopPropagation(); map[k](); }
  }, { capture: true });

  ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => {
    e.preventDefault();
    document.body.classList.add('dragging');
  }));
  ['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget) return;
    document.body.classList.remove('dragging');
  }));
  document.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  // 粘贴已转义字符串时给出一键处理提示
  editor.view.contentDOM.addEventListener('paste', () => {
    setTimeout(() => {
      const t = editor.getText().trim();
      if (/^"[\s\S]*"$/.test(t) || /\\"/.test(t)) {
        setMsg(tr('msg.hintEsc'), 'note');
        const a = $('hintSmart');
        if (a) a.onclick = doSmart;
      }
    }, 0);
  });

  const workspace = $('workspace'), splitter = $('paneSplitter');
  const splitRoot = document.documentElement;
  const splitStyles = getComputedStyle(splitRoot);
  const leftWeight = parseFloat(splitStyles.getPropertyValue('--split-left'));
  const rightWeight = parseFloat(splitStyles.getPropertyValue('--split-right'));
  let splitRatio = leftWeight / (leftWeight + rightWeight);
  let splitDrag = null;

  function applySplitRatio(ratio, persist) {
    splitRatio = Math.max(0.2, Math.min(0.8, ratio));
    splitRoot.style.setProperty('--split-left', splitRatio + 'fr');
    splitRoot.style.setProperty('--split-right', (1 - splitRatio) + 'fr');
    splitter.setAttribute('aria-valuenow', Math.round(splitRatio * 100));
    if (persist) {
      try { localStorage.setItem('json-tool-split-ratio', String(splitRatio)); } catch (e) {}
    }
    editor.view.requestMeasure();
    positionAutocomplete();
    positionLeftMenus();
  }

  splitter.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || !e.isPrimary || splitDrag || splitter.offsetWidth === 0) return;
    e.preventDefault();
    splitter.focus({ preventScroll: true });
    splitDrag = { pointerId: e.pointerId, x: e.clientX, ratio: splitRatio };
    splitter.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
  });
  splitter.addEventListener('pointermove', (e) => {
    if (!splitDrag || e.pointerId !== splitDrag.pointerId) return;
    const width = workspace.clientWidth - splitter.offsetWidth;
    applySplitRatio(splitDrag.ratio + (e.clientX - splitDrag.x) / width, false);
  });
  function finishSplitDrag(e) {
    if (!splitDrag || e.pointerId !== splitDrag.pointerId) return;
    splitDrag = null;
    document.body.classList.remove('resizing');
    applySplitRatio(splitRatio, true);
    if (splitter.hasPointerCapture(e.pointerId)) splitter.releasePointerCapture(e.pointerId);
  }
  splitter.addEventListener('pointerup', finishSplitDrag);
  splitter.addEventListener('pointercancel', finishSplitDrag);
  splitter.addEventListener('lostpointercapture', finishSplitDrag);
  splitter.addEventListener('keydown', (e) => {
    let next = splitRatio;
    if (e.key === 'ArrowLeft') next -= e.shiftKey ? 0.05 : 0.01;
    else if (e.key === 'ArrowRight') next += e.shiftKey ? 0.05 : 0.01;
    else if (e.key === 'Home') next = 0.2;
    else if (e.key === 'End') next = 0.8;
    else return;
    e.preventDefault();
    applySplitRatio(next, true);
  });
  applySplitRatio(splitRatio, false);

  window.addEventListener('resize', () => { editor.view.requestMeasure(); positionAutocomplete(); positionLeftMenus(); });

  // 在工具间切换是整页跳转，用 sessionStorage 暂存编辑内容，回到本页时恢复；超出配额就放弃暂存
  const DRAFT_KEY = 'json-tool-draft';
  window.addEventListener('pagehide', () => {
    const text = editor.getText();
    try {
      if (text) sessionStorage.setItem(DRAFT_KEY, text);
      else sessionStorage.removeItem(DRAFT_KEY);
    } catch (e) {
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (err) { /* 存储不可用 */ }
    }
  });
  try {
    const draft = sessionStorage.getItem(DRAFT_KEY);
    if (draft && !editor.getText()) loadText(draft);
  } catch (e) { /* 存储不可用时从空白开始 */ }

  validate();
  updateEditorControls();
})();
</script>
</body>
</html>
